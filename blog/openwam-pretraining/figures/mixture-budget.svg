<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="450" viewBox="0 0 1120 450" role="img" aria-labelledby="title desc"><title id="title">A sample mixture is not an hour mixture.</title><desc id="desc">Reported sample shares are about 30 percent human video, 40 percent real robot and 30 percent simulation. Hour shares differ because native frame rates differ.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#76828e"/></marker></defs><style>text{font-family:Segoe UI,Arial,sans-serif;fill:#20252b;font-size:20px}.sub{font-size:18px;fill:#596570}.small{font-size:17px;fill:#596570}.heading{font-size:28px;font-weight:600}.box{fill:#fff;stroke:#ccd3da;stroke-width:1.5}.arrow{fill:none;stroke:#76828e;stroke-width:1.8;marker-end:url(#arrow)}</style><rect width="1120" height="450" fill="#f5f5f5"/>

<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="610" viewBox="0 0 1120 610" role="img" aria-labelledby="title desc"><title id="title">Test the pretraining route, then test the scene change.</title><desc id="desc">Four embodied-pretraining routes share inherited video priors and the downstream clean-only fine-tuning protocol. All three pretrained routes use 600 hours. Clean and randomized evaluations test different scene distributions.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#76828e"/></marker></defs><style>text{font-family:Segoe UI,Arial,sans-serif;fill:#20252b;font-size:20px}.sub{font-size:18px;fill:#596570}.small{font-size:17px;fill:#596570}.heading{font-size:28px;font-weight:600}.box{fill:#fff;stroke:#ccd3da;stroke-width:1.5}.arrow{fill:none;stroke:#76828e;stroke-width:1.8;marker-end:url(#arrow)}</style><rect width="1120" height="610" fill="#f5f5f5"/>

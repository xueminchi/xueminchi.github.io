<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="585" viewBox="0 0 1120 585" role="img">
<title>Joint attention: four dual-stream blocks then sixteen bidirectional single-stream blocks</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#626b75"/></marker></defs>
<rect width="1120" height="585" fill="#f5f5f5"/>

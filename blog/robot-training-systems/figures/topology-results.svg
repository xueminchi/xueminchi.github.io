<text x="36.00" y="88.00" font-size="20" text-anchor="start" fill="#222831" font-weight="400">Same 8 GPUs: 2 nodes x 4  |  Global batch 16</text>
<text x="36.00" y="124.00" font-size="18" text-anchor="start" fill="#596674" font-weight="400">Existing network cards; only the configuration changed.</text>

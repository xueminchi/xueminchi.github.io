<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="650" viewBox="0 0 1120 650" role="img" aria-labelledby="title desc"><title id="title">Shared interfaces. Different execution paths.</title><desc id="desc">Software responsibility map. The trainer calls input preparation and loss; the serving engine calls generation. A selected architecture composes video, action and optional vision-language backbones, with architecture-owned attention, denoising and fast paths. Arrows show calls and composition, not attention directions.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#77838d"/></marker></defs><style>text{font-family:Segoe UI,Arial,sans-serif;fill:#20252b;font-size:21px}.heading{font-size:29px;font-weight:600}.sub{font-size:19px;fill:#56636e}.small{font-size:18px;fill:#56636e}.blue{fill:#245c8a}.green{fill:#216c61}.arrow{fill:none;stroke:#77838d;stroke-width:1.8;marker-end:url(#arrow)}</style><rect width="1120" height="650" fill="#f5f5f5"/>

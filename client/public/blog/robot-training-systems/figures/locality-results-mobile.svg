<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1320" viewBox="0 0 660 1320" role="img" aria-labelledby="title desc">
<title id="title">Locality reduces long waits</title>
<desc id="desc">Measured trials on eight GPUs. Object-storage throughput rises from 32.10 and 33.12 to 43.66 samples/s; P95 step time falls from 4.875 and 5.089 to 1.665 seconds. Parallel-file-system trials are shown as a control.</desc>
<rect width="660" height="1320" fill="#f5f5f5"/>
<g font-family="Segoe UI,Arial,sans-serif" fill="#222831">
<text x="36" y="49" font-size="34" text-anchor="start" fill="#222831" font-weight="600">Locality reduces long waits</text>
<text x="36" y="92" font-size="26" text-anchor="start" fill="#596674" font-weight="400">1 node / 8 GPUs | Global batch 64</text>
<text x="36" y="158" font-size="31" text-anchor="start" fill="#222831" font-weight="600">Training throughput</text>
<path d="M36.00 232 V578" stroke="#dce1e6"/>
<text x="36.0" y="615" font-size="27" text-anchor="middle" fill="#596674" font-weight="400">0</text>
<path d="M205.62 232 V578" stroke="#dce1e6"/>
<text x="205.62" y="615" font-size="27" text-anchor="middle" fill="#596674" font-weight="400">15</text>
<path d="M375.23 232 V578" stroke="#dce1e6"/>
<text x="375.23" y="615" font-size="27" text-anchor="middle" fill="#596674" font-weight="400">30</text>
<path d="M544.85 232 V578" stroke="#dce1e6"/>
<text x="544.85" y="615" font-size="27" text-anchor="middle" fill="#596674" font-weight="400">45</text>
<text x="36" y="212" font-size="27" text-anchor="start" fill="#222831" font-weight="400">Object / random</text>
<text x="624" y="212" font-size="25" text-anchor="end" fill="#2d6a9e" font-weight="400">32.10 / 33.12</text>
<path d="M398.977 247 H410.511" stroke="#2d6a9e" stroke-width="3"/>
<circle data-trial="object_random_a" data-metric="samples_s" data-value="32.1" fill="#f5f5f5" stroke="#2d6a9e" stroke-width="2.4" cx="398.977" cy="247" r="7"/>
<path data-trial="object_random_b" data-metric="samples_s" data-value="33.12" fill="#f5f5f5" stroke="#2d6a9e" stroke-width="2.4" d="M410.511 238 l9 9 -9 9 -9 -9 Z"/>
<text x="36" y="312" font-size="27" text-anchor="start" fill="#222831" font-weight="400">Object / local</text>
<text x="624" y="312" font-size="25" text-anchor="end" fill="#2d6a9e" font-weight="400">43.66</text>
<path d="M529.694 347 H529.694" stroke="#2d6a9e" stroke-width="3"/>
<circle data-trial="object_local" data-metric="samples_s" data-value="43.66" fill="#2d6a9e" stroke="#2d6a9e" stroke-width="2.4" cx="529.694" cy="347" r="7"/>
<text x="36" y="412" font-size="27" text-anchor="start" fill="#222831" font-weight="400">Parallel FS / random</text>
<text x="624" y="412" font-size="25" text-anchor="end" fill="#287768" font-weight="400">43.59 / 43.43</text>
<path d="M527.093 447 H528.902" stroke="#287768" stroke-width="3"/>
<circle data-trial="filesystem_random_a" data-metric="samples_s" data-value="43.59" fill="#f5f5f5" stroke="#287768" stroke-width="2.4" cx="528.902" cy="447" r="7"/>
<path data-trial="filesystem_random_b" data-metric="samples_s" data-value="43.43" fill="#f5f5f5" stroke="#287768" stroke-width="2.4" d="M527.093 438 l9 9 -9 9 -9 -9 Z"/>
<text x="36" y="512" font-size="27" text-anchor="start" fill="#222831" font-weight="400">Parallel FS / local</text>
<text x="624" y="512" font-size="25" text-anchor="end" fill="#287768" font-weight="400">42.97</text>
<path d="M521.892 547 H521.892" stroke="#287768" stroke-width="3"/>
<circle data-trial="filesystem_local" data-metric="samples_s" data-value="42.97" fill="#287768" stroke="#287768" stroke-width="2.4" cx="521.892" cy="547" r="7"/>
<path d="M36 578 H624" stroke="#b9c2cd" stroke-width="1.5"/>
<text x="330" y="660" font-size="27" text-anchor="middle" fill="#596674" font-weight="400">samples/s (higher is better)</text>
<text x="36" y="758" font-size="31" text-anchor="start" fill="#222831" font-weight="600">Tail step time</text>
<path d="M36.00 832 V1178" stroke="#dce1e6"/>
<text x="36.0" y="1215" font-size="27" text-anchor="middle" fill="#596674" font-weight="400">0</text>
<path d="M232.00 832 V1178" stroke="#dce1e6"/>
<text x="232.0" y="1215" font-size="27" text-anchor="middle" fill="#596674" font-weight="400">2</text>
<path d="M428.00 832 V1178" stroke="#dce1e6"/>
<text x="428.0" y="1215" font-size="27" text-anchor="middle" fill="#596674" font-weight="400">4</text>
<path d="M624.00 832 V1178" stroke="#dce1e6"/>
<text x="624.0" y="1215" font-size="27" text-anchor="middle" fill="#596674" font-weight="400">6</text>
<text x="36" y="812" font-size="27" text-anchor="start" fill="#222831" font-weight="400">Object / random</text>
<text x="624" y="812" font-size="25" text-anchor="end" fill="#2d6a9e" font-weight="400">4.875 / 5.089</text>
<path d="M513.750 847 H534.722" stroke="#2d6a9e" stroke-width="3"/>
<circle data-trial="object_random_a" data-metric="p95_s" data-value="4.875" fill="#f5f5f5" stroke="#2d6a9e" stroke-width="2.4" cx="513.750" cy="847" r="7"/>
<path data-trial="object_random_b" data-metric="p95_s" data-value="5.089" fill="#f5f5f5" stroke="#2d6a9e" stroke-width="2.4" d="M534.722 838 l9 9 -9 9 -9 -9 Z"/>
<text x="36" y="912" font-size="27" text-anchor="start" fill="#222831" font-weight="400">Object / local</text>
<text x="624" y="912" font-size="25" text-anchor="end" fill="#2d6a9e" font-weight="400">1.665</text>
<path d="M199.170 947 H199.170" stroke="#2d6a9e" stroke-width="3"/>
<circle data-trial="object_local" data-metric="p95_s" data-value="1.665" fill="#2d6a9e" stroke="#2d6a9e" stroke-width="2.4" cx="199.170" cy="947" r="7"/>
<text x="36" y="1012" font-size="27" text-anchor="start" fill="#222831" font-weight="400">Parallel FS / random</text>
<text x="624" y="1012" font-size="25" text-anchor="end" fill="#287768" font-weight="400">1.683 / 1.675</text>
<path d="M200.150 1047 H200.934" stroke="#287768" stroke-width="3"/>
<circle data-trial="filesystem_random_a" data-metric="p95_s" data-value="1.683" fill="#f5f5f5" stroke="#287768" stroke-width="2.4" cx="200.934" cy="1047" r="7"/>
<path data-trial="filesystem_random_b" data-metric="p95_s" data-value="1.675" fill="#f5f5f5" stroke="#287768" stroke-width="2.4" d="M200.150 1038 l9 9 -9 9 -9 -9 Z"/>
<text x="36" y="1112" font-size="27" text-anchor="start" fill="#222831" font-weight="400">Parallel FS / local</text>
<text x="624" y="1112" font-size="25" text-anchor="end" fill="#287768" font-weight="400">1.687</text>
<path d="M201.326 1147 H201.326" stroke="#287768" stroke-width="3"/>
<circle data-trial="filesystem_local" data-metric="p95_s" data-value="1.687" fill="#287768" stroke="#287768" stroke-width="2.4" cx="201.326" cy="1147" r="7"/>
<path d="M36 1178 H624" stroke="#b9c2cd" stroke-width="1.5"/>
<text x="330" y="1260" font-size="27" text-anchor="middle" fill="#596674" font-weight="400">P95 seconds (lower is better)</text>
<text x="36" y="1302" font-size="25" text-anchor="start" fill="#596674" font-weight="400">Local = episode/window order; FS = file system.</text>
</g>
</svg>

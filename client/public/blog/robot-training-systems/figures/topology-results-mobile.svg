<text x="36.00" y="309.00" font-size="30" text-anchor="start" fill="#222831" font-weight="500">Restricted to 1 RDMA card</text>
<text x="36.00" y="342.00" font-size="25" text-anchor="start" fill="#596674" font-weight="400">per node</text>

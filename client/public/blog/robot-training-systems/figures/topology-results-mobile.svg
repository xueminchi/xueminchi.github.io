<text x="388.80" y="841.00" font-size="27" text-anchor="middle" fill="#596674" font-weight="400">15</text>
<path d="M506.40 356 V805" stroke="#dce1e6" stroke-width="1"/>
<text x="506.40" y="841.00" font-size="27" text-anchor="middle" fill="#596674" font-weight="400">20</text>

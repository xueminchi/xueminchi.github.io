<svg xmlns="http://www.w3.org/2000/svg" width="660" height="1000" viewBox="0 0 660 1000" role="img" aria-labelledby="title desc">
<title id="title">Correcting the RDMA configuration</title>
<desc id="desc">Same two nodes with four GPUs each. One enabled RDMA card per node: 16.38 samples/s. Two existing cards per node: 21.51, repeated at 21.93. Single-node eight-GPU reference: 22.25. No hardware added.</desc>
<rect width="660" height="1000" fill="#f5f5f5"/>
<g font-family="Segoe UI,Arial,sans-serif" fill="#222831">
<text x="36.00" y="49.00" font-size="32" text-anchor="start" fill="#222831" font-weight="600">Correcting the RDMA configuration</text>
<text x="36.00" y="94.00" font-size="27" text-anchor="start" fill="#222831" font-weight="400">Same 8 GPUs: 2 nodes x 4</text>
<text x="36.00" y="131.00" font-size="25" text-anchor="start" fill="#596674" font-weight="400">Global batch 16; no hardware added.</text>
<text x="36.00" y="168.00" font-size="25" text-anchor="start" fill="#596674" font-weight="400">Only the configuration changed.</text>
<path d="M36 220 H78" stroke="#596674" stroke-width="2" stroke-dasharray="6 5"/>

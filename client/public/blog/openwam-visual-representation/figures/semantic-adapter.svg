<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="600" viewBox="0 0 1120 600" role="img" aria-labelledby="title desc">
<title id="title">S-VAE learns feature reconstruction before becoming a frozen representation interface</title>
<desc id="desc">Training: standardized features, spatial transformer encoder, Gaussian bottleneck, sampled latent, and transformer decoder reconstruct features. WAM use: frozen encoder posterior mean feeds the world model; no reconstruction decoder is needed.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#687581"/></marker></defs>
<style>text{font:20px Segoe UI,Arial,sans-serif;fill:#20252b}.sub{font-size:18px;fill:#5a6570}.small{font-size:17px;fill:#5a6570}.box{fill:#fff;stroke:#c6cdd5;stroke-width:1.5}.line{fill:none;stroke:#687581;stroke-width:2;marker-end:url(#arrow)}.green{fill:#216c61}.blue{fill:#245c8a}</style>
<rect width="1120" height="600" fill="#f5f5f5"/>
<text x="28" y="40" style="font-size:27px">Learn a feature-space bottleneck. Then use a fixed mapping.</text>
<text x="28" y="90" class="blue">A / Standalone S-VAE training</text>
<text x="28" y="118" class="sub">Input: temporally aligned feature grids, standardized with stored channel statistics</text>
<rect class="box" x="28" y="147" width="260" height="82" rx="3"/><text x="158" y="177" text-anchor="middle">Spatial transformer encoder</text><text x="158" y="207" text-anchor="middle" class="small">Each time slice: [H × W, C]</text>
<path class="line" d="M288 188H329"/>
<rect x="332" y="147" width="213" height="82" fill="#e2eee9" stroke="#8bbcaf" rx="3"/><text x="438" y="177" text-anchor="middle">Gaussian projection</text><text x="438" y="207" text-anchor="middle" class="small">mean + log-variance</text>
<path class="line" d="M545 188H583"/>
<rect x="586" y="147" width="185" height="82" fill="#e2eee9" stroke="#8bbcaf" rx="3"/><text x="678" y="177" text-anchor="middle">Sampled latent</text><text x="678" y="207" text-anchor="middle" class="small">48 channels</text>
<path class="line" d="M771 188H809"/>
<rect class="box" x="812" y="147" width="280" height="82" rx="3"/><text x="952" y="177" text-anchor="middle">Projection + spatial decoder</text><text x="952" y="207" text-anchor="middle" class="small">Reconstruct input features</text>
<path class="line" d="M952 229V263H678"/>
<text x="669" y="269" text-anchor="end" class="small">Feature reconstruction + latent regularization</text>
<text x="28" y="305" class="sub">The decoder reconstructs features—not RGB. Attention mixes space, not latent time slices.</text>
<line x1="28" y1="331" x2="1092" y2="331" stroke="#c6cdd5"/>
<text x="28" y="373" class="green">B / WAM training and inference</text>
<text x="28" y="402" class="sub">Frozen encoder + trained reducer; no posterior sampling or feature-reconstruction decoder</text>
<rect class="box" x="28" y="430" width="260" height="82" rx="3"/><text x="158" y="460" text-anchor="middle">Aligned encoder features</text><text x="158" y="490" text-anchor="middle" class="small">Current observation / targets</text>
<path class="line" d="M288 471H329"/>
<rect x="332" y="430" width="439" height="82" fill="#e2eee9" stroke="#8bbcaf" rx="3"/><text x="551" y="460" text-anchor="middle">Frozen S-VAE encoder → posterior mean</text><text x="551" y="490" text-anchor="middle" class="small">[B, C, T, H, W] → [B, 48, T, H, W]</text>
<path class="line" d="M771 471H809"/>
<rect class="box" x="812" y="430" width="280" height="82" rx="3"/><text x="952" y="460" text-anchor="middle">Normalize → world model</text><text x="952" y="490" text-anchor="middle" class="small">Joint world/action learning</text>
<text x="28" y="562" class="green">Width is compressed. Spatial grid and latent time length are preserved by the S-VAE.</text>
<text x="28" y="590" class="small">Implementation diagram; the manuscript does not specify the exact adapter run configuration.</text>
</svg>

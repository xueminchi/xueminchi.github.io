  <script id="benchmark-data" type="application/json">{"schema_version":1,"generated_at":"2026-05-24T11:42:52+08:00","summary":{"entry_count":50,"stage_counts":{"真机 / 真实世界评测":12,"Real-to-Sim / Validation Proxy":6,"仿真 VLA / Manipulation":19,"WAM / Embodied World Model":13},"priority_tier_counts":{"P0":8,"P1":18,"unassigned":24,"P2":8},"error_count":0,"warning_count":24},"views":[{"id":"all","label":"全量文献库"},{"id":"phase1_real","label":"第一阶段真机推荐"},{"id":"phase2_sim_validation","label":"第二阶段 validation / sim proxy"},{"id":"wam_world_model","label":"WAM / world model 专属评测"},{"id":"industrial_systems","label":"工业界系统论文参考"}],"records":[{"id":"1.1","stage_id":"1","stage_label":"真机 / 真实世界评测","display_name":"AutoEval","title":"AutoEval: Autonomous Evaluation of Generalist Robot Manipulation Policies in the Real World","year":"2025","type":"真机自动评测系统","links":[{"label":"arXiv","key":"arxiv","url":"https://arxiv.org/abs/2503.24278"},{"label":"Project","key":"project","url":"https://auto-eval.github.io/"},{"label":"GitHub","key":"github","url":"https://github.com/zhouzypaul/auto_eval"}],"arxiv_id":"2503.24278","summary":"AutoEval 的核心不是提出新任务，而是把真实机器人 policy 评测做成可以长时间运行的自动化流程，重点在 success detection、reset 和 episode job queue。","details":"AutoEval 是一篇偏评测系统工程的真机工作，核心目标不是扩展任务库，而是把 generalist robot policy 的真实世界评测变成可调度、可记录、可较长时间运行的流程。它关注一次 episode 如何启动、如何判定有效、如何自动或半自动判断成功、失败后如何 reset，以及多个评测任务如何排队执行。\n\n这篇工作的价值在于把 success rate 背后的执行过程显式化。对真实机器人来说，评测成本往往来自人工监督、异常恢复和重复初始化，而不是模型 forward 本身；因此 AutoEval 把 success detection、reset、intervention 和 system error 都放进评测系统设计。它适合提醒评测日志不要只保存最终成败，还要保存 episode duration、reset count、human intervention count、invalid reason 等过程字段。\n\n对当前 benchmark reference 来说，AutoEval 是第一阶段真机评测的基础参考。第一版不必追求完全自动 reset 或完全自动 success classifier，但应尽早固定 episode schema，并允许人工标注、规则判定和未来自动判定器在同一套日志里对齐。","key_points":["适合作为“真机评测系统工程化”的参考，而不是只看具体任务设计。","最值得读的是它如何定义一次有效 episode、如何自动判定成功、如何处理 reset 与异常。","对当前项目最有价值的是降低人工监督成本，并把评测过程结构化成可回放、可统计的数据。"],"our_takeaways":["真机 demo 第一版可以先不全自动，但应从一开始记录 `valid_trial`、`invalid_reason`、`reset_count`、`human_intervention_count`。","success classifier 可以先由人工标注或半自动规则替代，后续再训练自动判定器。"],"cautions":["自动 reset 和自动 success detection 对硬件、任务边界、传感器稳定性要求较高，第一阶段不要为了全自动牺牲评测可信度。"],"core_content":["面向 generalist robot policy 的真实世界自动评测。","强调自动 success detection、自动 reset、evaluation job queue。","目标是显著降低人工监督成本，让真机评测可以长时间运行。"],"metric_ideas":["success rate","episode duration","reset / intervention count","motor reset / system error","自动 success classifier 与人工 ground truth 的一致性"],"current_stage_advice":["第一阶段不必全自动，但可以借鉴它的 episode 结构化记录方式。","适合把 `human_intervention_count`、`reset_count`、`valid_trial`、`invalid_reason` 纳入 P0。"],"priority_tiers":["P0"],"priority_label":"P0","recommended_views":[{"id":"phase1_real","label":"第一阶段真机推荐"}],"summary_reasons":[{"view":"第一阶段真机推荐","text":"参考自动化真机评测流程、success detection、reset、episode job queue 思路。"}],"detail_href":"details/1-1-autoeval.html"},{"id":"1.2","stage_id":"1","stage_label":"真机 / 真实世界评测","display_name":"RoboArena","title":"RoboArena: Distributed Real-World Evaluation of Generalist Robot Policies","year":"2025","type":"分布式真机评测 / pairwise policy ranking","links":[{"label":"arXiv","key":"arxiv","url":"https://arxiv.org/abs/2506.18123"},{"label":"Project","key":"project","url":"https://robo-arena.github.io/"}],"arxiv_id":"2506.18123","summary":"RoboArena 把真机评测从固定单模型打分扩展成分布式 evaluator 下的 pairwise policy comparison，重点是如何聚合不同场景中的相对偏好。","details":"RoboArena 是面向 generalist robot policies 的分布式真机评测框架，重点从“单个模型在固定任务上的绝对分数”转向“多个 policy/checkpoint 在真实 evaluator 和真实环境中的相对比较”。它使用 pairwise comparison 来组织评测，使不同任务难度、不同 evaluator、不同真实场景带来的噪声更容易被聚合。\n\n这篇工作的关键启发是评测对象不一定总是单个 policy 的 success rate，也可以是 checkpoint A/B 或多策略之间的偏好关系。日志需要记录 baseline policy、comparison policy、任务、环境、evaluator、winner、tie/invalid 等信息，这些字段比一个总分更适合支撑后续模型迭代。\n\n对内部评测系统而言，RoboArena 适合放在“多版本 policy 对比”的设计参考里。即使第一阶段暂时不做 Elo 或公开排行榜，也可以先用同任务、同初始状态、同 evaluator 的 A/B 协议保存成对比较结果，为后续 ranking 或模型选择提供更稳的依据。","key_points":["适合参考 checkpoint A/B 或多策略对比，而不是单个策略的绝对成功率。","pairwise comparison 可以降低任务难度差异带来的噪声，尤其适合不同 evaluator 和不同真实环境。","它提醒评测日志应记录“谁和谁比较、在哪个任务/环境比较、比较结果是什么”，而不是只存一个最终分数。"],"our_takeaways":["内部比较两个 checkpoint 时，可以采用同任务、同初始状态、同 evaluator 的 A/B 协议。","即使暂时不做 Elo，也应该保存 `baseline_policy_id`、`comparison_policy_id`、`winner`、`tie_or_invalid`。"],"cautions":["分布式 evaluator 聚合适合规模化评测；小团队第一阶段更应先保证任务协议和日志一致。"],"core_content":["在多个真实环境中由不同 evaluator 运行策略。","使用 double-blind pairwise comparison 聚合策略排名。","不完全依赖固定任务集，而是通过 evaluator 的多样化场景提升覆盖面。"],"metric_ideas":["pairwise win rate","policy ranking","evaluator/task/environment breakdown","human preference / qualitative notes"],"current_stage_advice":["内部比较两个 checkpoint 时，可以借鉴 A/B pairwise：同一批任务、同一批初始状态，比较 A/B 哪个更好。","不一定第一阶段做 Elo 排名，但可以保存 `baseline_policy_id` 和 `comparison_policy_id`。"],"priority_tiers":["P0"],"priority_label":"P0","recommended_views":[{"id":"phase1_real","label":"第一阶段真机推荐"}],"summary_reasons":[{"view":"第一阶段真机推荐","text":"参考真实环境下 pairwise policy comparison、跨 evaluator 聚合排名。"}],"detail_href":"details/1-2-roboarena.html"},{"id":"1.3","stage_id":"1","stage_label":"真机 / 真实世界评测","display_name":"RoboChallenge / Table30","title":"RoboChallenge: Large-scale Real-robot Evaluation of Embodied Policies","year":"2025","type":"大规模真机在线评测系统","links":[{"label":"arXiv","key":"arxiv","url":"https://arxiv.org/abs/2510.17950"},{"label":"Table30","key":"table30","url":"https://robochallenge.ai/benchmark_detail"}],"arxiv_id":"2510.17950","summary":"RoboChallenge / Table30 的价值在于把真实机器人评测包装成在线 benchmark：固定任务集、统一执行协议和多模型对比。","details":"RoboChallenge / Table30 是把真实机器人评测组织成在线 benchmark 的代表，核心不是单个模型结构，而是固定任务集、统一执行协议、统一提交与比较方式。它展示了一种从任务表出发管理真机评测的方式：每个任务需要有明确入口、初始化、成功标准、失败判定和可复用的执行流程。\n\n这篇工作的评测价值在于“任务集合可扩展但协议稳定”。Table30 不意味着第一阶段需要立刻准备 30 个任务，而是提示任务可以从小规模内部表开始，逐步扩展到更大的 benchmark，同时保持 episode schema 和结果格式一致。这样后续增加任务时不会打断已有数据的可比性。\n\n对当前项目而言，它适合作为内部 `Table-4` / `Table-10` 的组织参考。真正值得迁移的是任务版本管理、任务级 success、模型统一对比、invalid trial 处理和在线结果汇总，而不是平台外观本身。","key_points":["最值得借鉴的是“任务表 + 统一 protocol + 统一记录格式”的评测组织方式。","Table30 的启发不是第一阶段立刻做 30 个任务，而是让任务数量可以从小表稳定扩展。","它适合帮助定义 demo 评测的任务版本、任务入口、失败判定和模型提交格式。"],"our_takeaways":["可以先做内部 `Table-4`：叠衣服、倒水、叠纸盒、捡垃圾，每个任务配固定初始化和成功标准。","后续扩展到 `Table-10` / `Table-30` 时，仍保持同一套 episode schema。"],"cautions":["在线 benchmark 平台本身不是第一阶段重点；优先级应放在任务定义和真实执行一致性上。"],"core_content":["构建在线真机评测系统，用于测试 robotic control algorithms / VLA models。","初始 benchmark 是 Table30，包含 30 个任务。"],"metric_ideas":["固定任务集","online submission / evaluation system","多模型统一对比","task-level success"],"current_stage_advice":["可借鉴“固定任务清单 + 统一执行协议”。","当前任务可以先定义 Table-4：叠衣服、倒水、叠纸盒、捡垃圾；后续扩展到 Table-10 / Table-30。"],"priority_tiers":["P0"],"priority_label":"P0","recommended_views":[{"id":"phase1_real","label":"第一阶段真机推荐"}],"summary_reasons":[{"view":"第一阶段真机推荐","text":"参考在线真机评测系统、固定任务集、真实 VLA 模型对比。"}],"detail_href":"details/1-3-robochallenge-table30.html"},{"id":"1.4","stage_id":"1","stage_label":"真机 / 真实世界评测","display_name":"RADAR","title":"RADAR: Benchmarking Vision-Language-Action Generalization via Real-World Dynamics, Spatial-Physical Intelligence, and Autonomous Evaluation","year":"2026","type":"真机 VLA generalization benchmark","links":[{"label":"arXiv","key":"arxiv","url":"https://arxiv.org/abs/2602.10980"}],"arxiv_id":"2602.10980","summary":"RADAR 关注真实部署中的动态扰动、空间物理能力和自动 3D 指标，适合提醒评测设计不要只在干净初始状态下看 success rate。","details":"RADAR 是面向真实世界 VLA generalization 的 benchmark，关注模型在动态扰动、空间物理变化和自主评测条件下是否仍然可靠。它把真实部署中的变化拆成更具体的评测维度，例如物体状态、机器人初始状态、光照、sensor noise、空间关系和 3D 指标。\n\n这篇工作的重点不是单纯增加任务数量，而是避免在过于干净的 tabletop setup 里高估模型能力。对 VLA 来说，aggregate success rate 可能掩盖 OOD 失败，因此 RADAR 更强调按扰动类型分桶统计，并把空间物理能力和真实动态变化纳入评测协议。\n\n对当前阶段最可迁移的是扰动 taxonomy 和日志字段设计。第一阶段可以先人工或规则化记录 `object_pose_shift`、`lighting_condition`、`distractor_present`、`robot_initial_pose` 等标签，暂时不必把自动 3D metric 作为阻塞项。","key_points":["最值得读的是扰动维度设计：物体状态、机器人初始位姿、光照、sensor noise 和空间关系。","它把 VLA generalization 落到真实世界动态变化，而不是只在固定 tabletop setup 上跑成功率。","自动 3D metrics 很强，但对传感器和标定要求也更高。"],"our_takeaways":["第一阶段可以先人工或规则化记录扰动标签，例如 `object_pose_shift`、`lighting_condition`、`distractor_present`。","成功率应按扰动类型分桶查看，避免 aggregate success 掩盖 OOD 失败。"],"cautions":["3D spatial metric 不应成为第一阶段阻塞项；可以先把扰动维度设计好，自动指标放到第二阶段。"],"core_content":["关注真实世界动态扰动、spatial-physical intelligence、自动 3D metrics。","认为很多 benchmark 没有充分覆盖真实部署中的变化。"],"metric_ideas":["real-world dynamics perturbation","robot initial state variation","object configuration variation","lighting / sensor noise","3D spatial metric"],"current_stage_advice":["第一阶段不必做 3D 自动指标。","但非常适合借鉴扰动维度：物体位置、物体姿态、光照、干扰物、机器人初始位姿。"],"priority_tiers":["P0","P1"],"priority_label":"P0 / P1","recommended_views":[{"id":"phase1_real","label":"第一阶段真机推荐"}],"summary_reasons":[{"view":"第一阶段真机推荐","text":"参考真机扰动维度：物体状态、机器人初始状态、光照、sensor noise、3D spatial metrics。"}],"detail_href":"details/1-4-radar.html"},{"id":"1.5","stage_id":"1","stage_label":"真机 / 真实世界评测","display_name":"VLA-REPLICA","title":"VLA-REPLICA: A Low-Cost, Reproducible Benchmark for Real-World Evaluation of Vision-Language-Action Models","year":"2026","type":"低成本可复现实机 benchmark","links":[{"label":"arXiv HTML","key":"arxiv_html","url":"https://arxiv.org/html/2605.20774v1"}],"arxiv_id":"2605.20774","summary":"VLA-REPLICA 强调低成本、可复现的真实 VLA 评测平台，核心价值是让不同实验室能用相似硬件和受控环境比较模型。","details":"VLA-REPLICA 是低成本、可复现真机评测平台方向的代表，关注如何用相对标准化的硬件、相机、光照和任务环境来比较 VLA 模型。它的价值不在于任务特别复杂，而在于把真实评测条件控制到足够稳定，使不同实验室或不同时间的结果具有可比性。\n\n这篇工作适合提醒评测系统先固定环境，再扩大任务。真实机器人评测里，相机位置、桌面、光照、物体集合和初始化方式的轻微差异都可能影响结果；因此可复现 setup 本身就是 benchmark 可信度的一部分。ID/OOD protocol 也应该成为场景配置，而不是评测结束后的文字描述。\n\n对内部 demo 系统而言，VLA-REPLICA 更像第一阶段的环境标准化参考。它不覆盖完整开放世界复杂度，但适合作为稳定基准，帮助区分模型退化、环境漂移和任务定义不一致。","key_points":["它的重点不是复杂任务，而是把真实环境标准化到足够可复现。","受控 light-box、低成本机械臂和 RGB-D setup 对内部 demo 系统很有启发。","该工作的主要价值是提醒评测设计先把场景固定住。"],"our_takeaways":["当前阶段应优先固定相机、光照、桌面、物体集合和任务初始化，而不是追求任务数量。","可以把 ID / OOD protocol 做成场景配置，而不是事后凭印象描述。"],"cautions":["低成本可复现 setup 牺牲了一部分开放环境复杂度；它更适合作为稳定基准，不代表完整真实部署。"],"core_content":["使用低成本机械臂、RGB-D camera、受控 light-box 环境构建可复现实机评测。","目标是让不同实验室能用相似低成本 setup 比较 VLA。"],"metric_ideas":["low-cost standardized setup","ID / OOD protocol","controlled lighting / scene","locally executable real-world evaluation"],"current_stage_advice":["对内部 demo 系统很有参考价值：先把真机环境标准化，而不是一开始追求复杂任务。"],"priority_tiers":["P0","P1"],"priority_label":"P0 / P1","recommended_views":[{"id":"phase1_real","label":"第一阶段真机推荐"}],"summary_reasons":[{"view":"第一阶段真机推荐","text":"参考低成本、可复现实机评测平台设计。"}],"detail_href":"details/1-5-vla-replica.html"},{"id":"1.6","stage_id":"1","stage_label":"真机 / 真实世界评测","display_name":"LongBench","title":"LongBench: Evaluating Robotic Manipulation Policies on Real-World Long-Horizon Tasks","year":"2026","type":"真实长程 manipulation benchmark","links":[{"label":"arXiv","key":"arxiv","url":"https://arxiv.org/abs/2604.16788"},{"label":"arXiv HTML","key":"arxiv_html","url":"https://arxiv.org/html/2604.16788v1"}],"arxiv_id":"2604.16788","summary":"LongBench 面向真实长程操作任务，重点是把总成功率拆解为 context-independent / context-dependent 任务和阶段化失败来源。","details":"LongBench 聚焦真实长程 manipulation 任务，适合叠衣服、整理、装配、叠纸盒这类不能用短 horizon pick-place 简化的场景。它的重要性在于把长程任务的评测从最终 success rate 拆成 context-independent / context-dependent 任务、阶段进度和失败来源。\n\n长程任务的诊断价值往往不在最终是否成功，而在失败发生在哪个阶段。模型可能完成定位和抓取，但在展开、对齐、折叠或放置阶段失败；如果只记录最终失败，就无法判断问题来自感知、计划、动作控制还是上下文理解。LongBench 因此适合引入 `failure_stage`、`terminal_progress_level`、`context_dependency` 等字段。\n\n对当前 benchmark reference 来说，LongBench 是第一阶段长程真机任务的核心参考。它提示内部任务数量可以少，但每个 episode 应该有高质量阶段化记录，避免长程任务的昂贵数据只留下一个粗粒度成功/失败标签。","key_points":["它适合指导叠衣服、叠纸盒、整理等长程 demo 的评测，而不是短 horizon pick-place。","最值得参考的是 failure stage、terminal progress 和上下文依赖任务的分组方式。","它提醒评测设计：长程任务只看最终 success 会丢掉大量诊断信息。"],"our_takeaways":["长程任务应记录 `failure_stage`、`terminal_progress_level`、`context_dependency`。","可以把任务拆成可观察子阶段，例如定位、抓取、展开、对齐、折叠、放置。"],"cautions":["长程任务 episode 成本高，第一阶段应少量高质量采集，而不是追求大量任务覆盖。"],"core_content":["真实世界长程 manipulation，超过 1000 个 real-world episodes。","将任务分成 Context-Independent 和 Context-Dependent 两类。","目的不是只给总成功率，而是分析长程失败来源。"],"metric_ideas":["long-horizon success","temporal consistency","context-dependent reasoning","ambiguity-specific subsets","failure mode 分解"],"current_stage_advice":["叠衣服、叠纸盒这类长程任务可以借鉴：不要只看最终成功，要记录 `failure_stage` 和 `terminal_progress_level`。"],"priority_tiers":["P0"],"priority_label":"P0","recommended_views":[{"id":"phase1_real","label":"第一阶段真机推荐"}],"summary_reasons":[{"view":"第一阶段真机推荐","text":"参考长程真机任务如何分 context-independent / context-dependent，如何避免只看 aggregate success。"}],"detail_href":"details/1-6-longbench.html"},{"id":"1.7","stage_id":"1","stage_label":"真机 / 真实世界评测","display_name":"ManipArena","title":"ManipArena: Comprehensive Real-world Evaluation of Reasoning-Oriented Generalist Robot Manipulation","year":"2026","type":"真实 + real-to-sim reasoning-oriented benchmark","links":[{"label":"arXiv","key":"arxiv","url":"https://arxiv.org/abs/2603.28545"},{"label":"GitHub","key":"github","url":"https://github.com/maniparena/maniparena-repo"},{"label":"Dataset","key":"dataset","url":"https://huggingface.co/datasets/ManipArena/maniparena-dataset"}],"arxiv_id":"2603.28545","summary":"ManipArena 把真实评测、real-to-sim 环境、reasoning-oriented manipulation 和丰富传感诊断放在一起，适合作为第二阶段综合评测蓝图。","details":"ManipArena 是更综合的 reasoning-oriented manipulation 评测框架，把真实评测、real-to-sim 环境、controlled OOD、语义/空间推理任务和丰富传感诊断放在同一套体系里。它不是最小真机闭环，而是展示了当基础 episode logging 稳定之后，评测系统可以怎样向诊断型 benchmark 演进。\n\n这篇工作的重点是把任务成功、语言指令、场景语义、目标对象关系、低层运动信号和 real-to-sim 诊断联系起来。相比只看 task success，它更适合回答“模型为什么失败”：是语义理解错、空间关系错、对象绑定错，还是底层动作执行不稳定。\n\n对当前项目而言，ManipArena 适合作为第二阶段蓝图。第一阶段可先吸收任务标签、失败原因和 episode schema；后续如果接入 robot state/action log 或 sim diagnostic，可以逐步形成更接近 ManipArena 的跨模态诊断能力。","key_points":["它不只是 task success，而是关注 semantic / spatial reasoning、controlled OOD 和低层运动信号。","真实 + real-to-sim 的组合适合诊断为什么模型在真实环境失败。","对 WAM/VLA 混合系统，它提供了把行为、感知和状态日志联系起来的方向。"],"our_takeaways":["第一阶段可以先借鉴任务标签和失败记录，第二阶段再接入 robot state/action log 与 sim diagnostic。","对 reasoning-oriented 任务，应保存语言指令、场景语义、目标对象关系和失败原因。"],"cautions":["完整 ManipArena 复杂度较高，不适合作为第一阶段最小闭环；更适合在基础 episode logging 稳定后逐步吸收。"],"core_content":["针对 VLA 和 world model 的 reasoning-oriented manipulation 评测。","包含 20 个任务、10,812 expert trajectories。","支持 controlled OOD、long-horizon mobile manipulation、rich sensory diagnostics、real-to-sim environment。"],"metric_ideas":["semantic reasoning","spatial reasoning","controlled OOD","low-level motor signals","synchronized real-to-sim diagnostics"],"current_stage_advice":["第一阶段不必做到这么复杂。","第二阶段可以借鉴它的 rich sensory diagnostics，把 robot state/action log 和成功/失败原因关联起来。"],"priority_tiers":["P1"],"priority_label":"P1","recommended_views":[{"id":"phase1_real","label":"第一阶段真机推荐"}],"summary_reasons":[{"view":"第一阶段真机推荐","text":"参考真实 + real-to-sim 混合评测、reasoning-oriented manipulation、rich sensory diagnostics。"}],"detail_href":"details/1-7-maniparena.html"},{"id":"1.8","stage_id":"1","stage_label":"真机 / 真实世界评测","display_name":"FurnitureBench","title":"FurnitureBench: Reproducible Real-World Benchmark for Long-Horizon Complex Manipulation","year":"2023","type":"可复现实机长程装配 benchmark","links":[{"label":"arXiv","key":"arxiv","url":"https://arxiv.org/abs/2305.12821"}],"arxiv_id":"2305.12821","summary":null,"details":null,"key_points":[],"our_takeaways":[],"cautions":[],"core_content":["真实家具装配任务，提供数据、3D printable models、robot setup guide。"],"metric_ideas":["long-horizon assembly","task initialization","reproducible hardware/object setup"],"current_stage_advice":["时间略早，不属于严格近两年，但对“叠纸盒 / 长程装配类任务”的阶段拆解和可复现 setup 有参考价值。"],"priority_tiers":[],"priority_label":null,"recommended_views":[],"summary_reasons":[],"detail_href":"details/1-8-furniturebench.html"},{"id":"1.9","stage_id":"1","stage_label":"真机 / 真实世界评测","display_name":"pi0","title":"pi0: A Vision-Language-Action Flow Model for General Robot Control","year":"2024","type":"工业界 generalist VLA 系统论文 / 真机评测参考","links":[{"label":"arXiv","key":"arxiv","url":"https://arxiv.org/abs/2410.24164"},{"label":"Project","key":"project","url":"https://physicalintelligence.company/blog/pi0"}],"arxiv_id":"2410.24164","summary":"pi0 是 Physical Intelligence 的基础 generalist VLA，核心价值在于把预训练 VLM、跨本体机器人数据、flow-matching action chunk 和 post-training 组合成可部署的真实机器人 policy。","details":"pi0 是 Physical Intelligence 系列 VLA 的基础系统论文，定位不是 benchmark，而是工业级 generalist robot policy 的系统设计参考。它把预训练 VLM、跨本体机器人数据、flow-matching action chunk 和任务级 post-training 组合在一起，展示了一个可部署 VLA 如何从 broad pretraining 走向具体机器人任务。\n\n这篇工作的技术重点在 action interface 和训练分层。flow matching 用于生成连续 action chunks，意味着评测时不能只记录最终成功率，还需要记录 action horizon、control frequency、chunk latency、失败发生的时间位置，以及 policy 是 base model 还是 post-trained checkpoint。跨本体训练也提示评测日志需要保留 robot configuration 和 embodiment tag。\n\n对当前 benchmark reference 来说，pi0 适合作为工业 VLA 基线画像。它不提供一套可复现公开 benchmark，但适合帮助评测系统预留 `base_policy_id`、`posttrain_task_id`、`robot_config`、`action_horizon`、`control_hz` 等字段，为后续比较不同训练阶段和不同数据来源的 policy 做准备。","key_points":["它不是 benchmark，但展示了一个工业级 VLA 系统怎样把 broad robot pretraining 与任务级 post-training 分开。","action chunk + flow matching 是它的关键控制接口，适合提示评测时记录 chunk latency、执行频率和失败发生的时间位置。","跨本体数据混合、robot config padding/masking、task/robot sampling 等设计，对未来整理内部数据账本有参考价值。"],"our_takeaways":["评测日志里应区分 `base_policy_id`、`posttrain_task_id`、`robot_config`、`action_horizon`、`control_hz`。","第一阶段不需要复现 pi0 的训练规模，但应该学习它把“泛化能力”和“目标任务适配”分开评估。","如果未来比较不同 policy，不能只记录最终成功率，还要记录它对应的训练阶段和数据来源。"],"cautions":["很多训练数据、采样比例和数据清洗细节是私有的；它适合作为系统设计参考，不适合作为可复现 benchmark。","论文主要证明 generalist VLA 的可行性，不等价于给出一套独立的公开评测协议。"],"core_content":["使用预训练 VLM backbone 与 action expert 生成连续动作。","用 flow matching 预测 action chunks，在多个机器人构型和任务上训练。","区分 broad pretraining 与目标任务 post-training。"],"metric_ideas":["action chunk horizon / control frequency","pretrain vs posttrain policy ID","robot configuration / embodiment tag","task-level success and failure stage","data source / sampling mixture metadata"],"current_stage_advice":["先把 `policy_source`、`robot_config`、`action_chunk_len`、`control_hz` 这类字段留出来。","pi0 本身不是第一阶段 benchmark，但它是理解 PI 后续 pi0.5、pi0.6、pi0.7 的基线。"],"priority_tiers":["P1"],"priority_label":"P1","recommended_views":[{"id":"industrial_systems","label":"工业界系统论文参考"}],"summary_reasons":[{"view":"工业界系统论文参考","text":"参考 generalist VLA 的基础系统设计：flow action chunks、跨本体数据、pretrain/posttrain 分层和真实机器人任务覆盖。"}],"detail_href":"details/1-9-pi0.html"},{"id":"1.10","stage_id":"1","stage_label":"真机 / 真实世界评测","display_name":"pi0.5","title":"pi0.5: A Vision-Language-Action Model with Open-World Generalization","year":"2025","type":"工业界 open-world VLA 系统论文 / 真实家居泛化评测参考","links":[{"label":"arXiv","key":"arxiv","url":"https://arxiv.org/abs/2504.16054"},{"label":"Project","key":"project","url":"https://pi.website/blog/pi05"}],"arxiv_id":"2504.16054","summary":"pi0.5 在 pi0 基础上强调 open-world generalization，通过多机器人数据、移动操作数据、高层语义预测、web 数据和两阶段训练，让模型能在新家、新场景中执行长程 household tasks。","details":"pi0.5 是 Physical Intelligence 在 pi0 基础上面向 open-world generalization 的系统论文，关注模型是否能在新家、新物体和更长程 household tasks 中泛化。它把多机器人数据、移动操作数据、web 多模态数据、高层语义预测和 action post-training 组合起来，使评测目标从固定桌面任务扩展到更开放的家庭环境。\n\n这篇工作对评测设计的价值在于拆分“开放世界泛化”。新环境、新物体、新语言表达、长程任务和阶段性 progress 应该被分开记录，而不是被一个最终 success rate 混在一起。它也提示语言指令、高层 subtask、目标对象状态和 partial completion 都是评测日志的重要组成部分。\n\n对当前项目而言，pi0.5 适合作为真实家居泛化的中期参考。第一阶段不需要直接铺开 open-world household benchmark，但可以从现在开始保留 `environment_id`、`seen_unseen_env`、`object_seen_status`、`subtask_progress`、原始 instruction 和 high-level subtask label，避免后续做泛化分析时缺关键字段。","key_points":["重点不是某个固定 benchmark，而是如何把真实家居泛化拆成新环境、新物体、长程任务、语义理解和低层控制。","它把 robot action 学习与 high-level semantic prediction / bbox / web multimodal data 放到同一训练配方里，提示评测不能只看桌面短任务。","适合参考 `progress score`、OOD home/object/language split，以及长程任务的阶段性成功。"],"our_takeaways":["对“收拾桌面 / 整理房间 / 厨房类”长程任务，应记录 `environment_id`、`seen_unseen_env`、`object_seen_status`、`subtask_progress`。","对自然语言任务，应保留原始 instruction 和可能的 high-level subtask label，后续才能分析语言泛化失败。","第一阶段可以先把 task progress 离散成 0-5 档，不必一开始就做复杂自动判定。"],"cautions":["数据来源和权重仍有大量私有细节；公开可复现性有限。","open-world 评测成本高，不适合在 demo 初期一次性铺开。"],"core_content":["使用移动操作、跨本体实验室数据、web 多模态数据和高层语义任务共同训练。","先做 next-token / semantic pretraining，再做 flow-matching action expert post-training。","评估目标从固定桌面任务扩展到新家中的长程任务。"],"metric_ideas":["seen vs unseen home","seen vs unseen object","task progress / partial completion","high-level subtask prediction","long-horizon household task success"],"current_stage_advice":["暂时不需要复刻 open-world home eval，但可以把 `env_id`、`object_split`、`subtask_progress` 提前纳入日志。","从桌面 demo 扩到真实房间任务时，pi0.5 是比纯仿真 benchmark 更贴近工业部署的参考。"],"priority_tiers":["P1"],"priority_label":"P1","recommended_views":[{"id":"industrial_systems","label":"工业界系统论文参考"}],"summary_reasons":[{"view":"工业界系统论文参考","text":"参考 open-world home generalization 的评测组织：新家、新物体、长程 household tasks 和 progress score。"},{"view":"工业界系统论文参考","text":"参考 generalist VLA 的基础系统设计：flow action chunks、跨本体数据、pretrain/posttrain 分层和真实机器人任务覆盖。"}],"detail_href":"details/1-10-pi0-5.html"},{"id":"1.11","stage_id":"1","stage_label":"真机 / 真实世界评测","display_name":"pi-star-0.6 / RECAP","title":"pi-star-0.6: a VLA That Learns From Experience / RECAP","year":"2025","type":"工业界 RL-VLA / 真机经验学习与 correction data 参考","links":[{"label":"arXiv","key":"arxiv","url":"https://arxiv.org/abs/2511.14759"},{"label":"Project","key":"project","url":"https://pi.website/blog/pistar06"}],"arxiv_id":"2511.14759","summary":"pi-star-0.6 的核心是 RECAP：把 demonstrations、autonomous rollouts、稀疏 outcome labels 和专家 corrections 结合起来，用 advantage-conditioned policies 从真实机器人经验中继续改进 VLA。","details":"pi-star-0.6 / RECAP 是 PI 系列里很适合作为“真机数据回流”参考的系统论文。它关注的不是静态 benchmark 排名，而是真实机器人在 autonomous rollouts 中产生成功、失败、人工接管和专家 correction 后，如何把这些经验继续用于改进 VLA。\n\n这篇工作的核心价值在于把失败和纠正数据视为可学习资产。demonstrations、autonomous rollouts、outcome labels 和 expert corrections 在系统里承担不同角色；评测日志因此需要保存 outcome、failure type、intervention count、correction episode、time to success、throughput 等信息。否则真机运行只会留下成败统计，无法形成后续训练闭环。\n\n对当前阶段来说，RECAP 不需要立刻落地 RL 或 advantage-conditioned policy，但建议从第一版 episode schema 开始区分 `demo`、`eval_only`、`autonomous_rollout`、`human_correction` 等数据角色。这样后续做数据回流时，失败 episode 和人工纠正不会被当成无效 trial 丢掉。","key_points":["这是最值得第一阶段借鉴的工业系统论文之一，因为它直接回答“真机跑出来的失败和纠正数据怎么回流”。","论文关注 throughput、failure rate、intervention/correction 数据，而不是只报一次静态成功率。","真实任务覆盖 laundry、diverse laundry、targeted failure removal、espresso、box assembly，和当前关注的长程真实操作很接近。"],"our_takeaways":["episode schema 应从一开始记录 `outcome_label`、`failure_type`、`intervention_count`、`correction_episode_id`、`time_to_success`。","如果人工接管或纠正发生，应把它作为可学习数据，而不是只当作无效 trial 丢掉。","后续做数据回流时，可以把 `autonomous_rollout`、`human_correction`、`demo`、`eval_only` 区分成不同数据角色。"],"cautions":["RECAP 的价值建立在持续真机部署、人工纠正和 outcome labeling 能力上；第一阶段可以先记录字段，不必马上做 RL。","具体训练细节、数据规模和硬件配置仍有工业系统门槛。"],"core_content":["训练 value function 估计任务剩余成功价值，再把动作 advantage 离散成正/负条件输入。","用真实 rollout 结果、人工 corrections 和稀疏成功/失败信号更新 policy。","目标是让 VLA 从自己真实部署中的经验继续变好。"],"metric_ideas":["throughput / successful episodes per hour","failure rate","human intervention count","correction episode count","outcome label","time-to-success / episode duration"],"current_stage_advice":["这是 P0 级参考。哪怕现在不做 RL，也应该立刻把 correction/intervention/outcome 字段设计进日志。","对叠衣服、纸盒、倒水这类任务，建议把“失败后人工怎么纠正”作为未来数据回流资产保存。"],"priority_tiers":["P0"],"priority_label":"P0","recommended_views":[{"id":"industrial_systems","label":"工业界系统论文参考"}],"summary_reasons":[{"view":"工业界系统论文参考","text":"参考真实机器人从 autonomous rollouts、outcome labels、人类 corrections 中学习时，如何记录 intervention、failure rate、throughput 和 correction data。"}],"detail_href":"details/1-11-pi-star-0-6-recap.html"},{"id":"1.12","stage_id":"1","stage_label":"真机 / 真实世界评测","display_name":"pi0.7","title":"pi0.7: a Steerable Generalist Robotic Foundation Model with Emergent Capabilities","year":"2026","type":"工业界 steerable generalist VLA / 混合质量数据与真实部署评测参考","links":[{"label":"arXiv","key":"arxiv","url":"https://arxiv.org/abs/2604.15483"},{"label":"Project","key":"project","url":"https://pi.website/pi07"}],"arxiv_id":"2604.15483","summary":"pi0.7 进一步强调 steerability 和 emergent capability，通过 context-rich、mixed-quality 的机器人与人类视频数据，把 task instruction、subtask、subgoal image、episode metadata、control mode 等上下文纳入同一个 generalist VLA 系统。","details":"pi0.7 是 PI 系列里偏 steerable generalist VLA 的工业系统论文，重点是如何利用 context-rich、mixed-quality 的机器人与人类视频数据，让同一个模型在任务指令、subtask、subgoal image、episode metadata 和 control mode 等条件下表现出可控能力。\n\n这篇工作对评测系统的启发很强：成功、失败、低质量演示、自主 rollout、human intervention 都可能成为有用数据，而不是简单被过滤掉。它把 quality score、mistake flag、control mode、speed bin、subgoal image、subtask instruction 等信息放进模型上下文，说明评测日志也应该保留这些字段，才能支持后续 steering、数据筛选和错误分析。\n\n对当前 benchmark reference 来说，pi0.7 是工业数据系统和真实部署评测的高级参考。第一阶段不需要复现其模型规模或私有数据体系，但应避免把 episode 只记录成 success/failure；更合理的做法是尽早保存质量、错误、控制模式和子目标信息，为未来多机器人、多控制模式和 human coaching 场景留出空间。","key_points":["对当前项目最有价值的是它如何利用 mixed-quality data：成功、失败、低质量演示、自主评测 rollout、人类 intervention 都不是废数据。","它把质量分数、mistake 标记、control mode、speed bin、subgoal image 等信息作为 steering / conditioning 信号，适合指导日志字段设计。","评测覆盖 out-of-box dexterity、memory、instruction following、dataset-bias breaking、cross-embodiment 和 human coaching。"],"our_takeaways":["评测日志应保留 `quality_score`、`mistake_flag`、`control_mode`、`speed_bin`、`subgoal_image_id`、`subtask_instruction`。","不要把失败 episode 简单删除；失败、低质量和 intervention 数据未来可能帮助模型学会避免错误。","对多机器人或多控制模式任务，应从第一版就记录 control mode，否则后面很难追溯。"],"cautions":["论文没有完整公开总数据规模、采样权重、各来源比例和完整 data card；更适合作为工业数据系统参考。","pi0.7 的能力声明很强，但很多结论依赖 PI 私有数据和部署体系。"],"core_content":["使用 4B 级 VLM、vision encoder 和 action expert 组成约 5B 规模机器人 foundation model。","训练数据包括高/低质量 robot demos、失败样本、自主 policy evaluation rollouts、人类 interventions、open robot datasets、egocentric human videos 和 web multimodal data。","通过丰富上下文和 metadata 让同一个模型在不同任务、质量目标、控制模式下可被 steer。"],"metric_ideas":["quality score","mistake / failure flag","control mode","subgoal image conditioning","cross-embodiment success","memory / instruction-following breakdown"],"current_stage_advice":["这是 P0 级日志设计参考。现在就可以把 episode metadata 做厚一点，后面再决定哪些字段用于训练。","如果未来要做 WAM/VLA 数据回流，pi0.7 的 mixed-quality 记录方式比“只存成功 demo”更有长期价值。"],"priority_tiers":["P0","P1"],"priority_label":"P0 / P1","recommended_views":[{"id":"industrial_systems","label":"工业界系统论文参考"}],"summary_reasons":[{"view":"工业界系统论文参考","text":"参考混合质量数据、episode metadata、control mode、subgoal/quality/mistake 等字段如何服务 steerable generalist VLA。"},{"view":"工业界系统论文参考","text":"参考 generalist VLA 的基础系统设计：flow action chunks、跨本体数据、pretrain/posttrain 分层和真实机器人任务覆盖。"}],"detail_href":"details/1-12-pi0-7.html"},{"id":"2.1","stage_id":"2","stage_label":"Real-to-Sim / Validation Proxy","display_name":"SIMPLER / SimplerEnv","title":"Evaluating Real-World Robot Manipulation Policies in Simulation / SIMPLER","year":"2024","type":"real-to-sim policy evaluation benchmark","links":[{"label":"arXiv","key":"arxiv","url":"https://arxiv.org/abs/2405.05941"},{"label":"Project","key":"project","url":"https://simpler-env.github.io/"}],"arxiv_id":"2405.05941","summary":null,"details":"SIMPLER / SimplerEnv 是 real-to-sim policy evaluation 的基础参考，核心问题是仿真评测能否预测真实机器人 policy 的表现。它不是把 sim success 当作最终目标，而是关注仿真环境中的结果和真实世界 rollout 之间是否存在可用相关性，尤其是能否预测不同 policy/checkpoint 的相对排名。\n\n这篇工作的关键价值在 validation proxy：如果仿真只能生成好看的成功率，但不能预测真机表现，那么它对模型迭代的意义有限。因此评测协议需要同时保存 sim performance、real performance、policy ranking agreement、distribution shift sensitivity 等信息，才能判断 sim 是否值得信任。\n\n对当前项目而言，SIMPLER 适合第二阶段作为 validation set 设计参考。第一阶段不宜把 sim success 当主指标；更合理的路径是先积累真机结果，后续用仿真 proxy 检查它是否能预测真机 checkpoint ranking。","key_points":[],"our_takeaways":[],"cautions":[],"core_content":["用仿真复现常见真实机器人 setup。","重点不是单纯 sim success，而是验证 simulation performance 与 real-world performance 的相关性。"],"metric_ideas":["sim-real correlation","policy ranking agreement","sensitivity to distribution shifts"],"current_stage_advice":["如果后续做 validation set / sim proxy，应该评估它是否能预测真机 checkpoint ranking。","不建议第一阶段把 sim success 当主指标。"],"priority_tiers":["P1"],"priority_label":"P1","recommended_views":[{"id":"phase2_sim_validation","label":"第二阶段 validation / sim proxy"}],"summary_reasons":[{"view":"第二阶段 validation / sim proxy","text":"不是只看 sim success，而是验证 sim 是否能预测 real ranking。"}],"detail_href":"details/2-1-simpler-simplerenv.html"},{"id":"2.2","stage_id":"2","stage_label":"Real-to-Sim / Validation Proxy","display_name":"REALM","title":"REALM: A Real-to-Sim Validated Benchmark for Generalization in Robotic Manipulation","year":"2025","type":"real-to-sim validated VLA benchmark","links":[{"label":"arXiv","key":"arxiv","url":"https://arxiv.org/abs/2512.19562"},{"label":"Project","key":"project","url":"https://martin-sedlacek.com/realm/"},{"label":"GitHub","key":"github","url":"https://github.com/martin-sedlacek/REALM/"}],"arxiv_id":"2512.19562","summary":null,"details":"REALM 是 real-to-sim validated VLA benchmark，强调仿真 benchmark 需要经过真实表现相关性验证。它把 manipulation skills、perturbation factors 和大量 objects 组织成高保真仿真评测，用于分析 VLA 在不同扰动条件下的泛化能力。\n\n这篇工作对评测系统最有用的是扰动矩阵和 sim-to-real validation 思路。它将 object、lighting、environment、control variation 等维度显式化，使 robustness 不再是模糊描述，而是可以分桶统计的实验条件。对 VLA 模型来说，这类扰动分解比单一总体成功率更能暴露泛化短板。\n\n对当前项目而言，REALM 适合作为第二阶段 robustness matrix 的参考。第一阶段可以先吸收它的扰动 taxonomy，并在真机日志里预留对应标签；完整高保真仿真系统可以等基础任务和真实评测数据稳定后再接入。","key_points":[],"our_takeaways":[],"cautions":[],"core_content":["高保真仿真环境，强调和真实表现的相关性。","包含 7 种 manipulation skills、15 类 perturbation factors、3500+ objects。","评估 π0、π0-FAST、GR00T N1.5 等 VLA。"],"metric_ideas":["perturbation robustness","object / lighting / environment / control variation","sim-to-real validation"],"current_stage_advice":["适合第二阶段做 robustness matrix。","第一阶段可先借鉴扰动 taxonomy，而非完整仿真系统。"],"priority_tiers":["P1"],"priority_label":"P1","recommended_views":[{"id":"phase2_sim_validation","label":"第二阶段 validation / sim proxy"}],"summary_reasons":[{"view":"第二阶段 validation / sim proxy","text":"15 类扰动、7 类技能、真实相关性验证，适合做 robustness validation。"}],"detail_href":"details/2-2-realm.html"},{"id":"2.3","stage_id":"2","stage_label":"Real-to-Sim / Validation Proxy","display_name":"PolaRiS","title":"PolaRiS: Scalable Real-to-Sim Evaluations for Generalist Robot Policies","year":"2025","type":"real-to-sim environment reconstruction benchmark / framework","links":[{"label":"arXiv","key":"arxiv","url":"https://arxiv.org/abs/2512.16881"},{"label":"Project","key":"project","url":"https://polaris-evals.github.io/"}],"arxiv_id":"2512.16881","summary":null,"details":"PolaRiS 关注如何从真实场景快速构建 real-to-sim evaluation 环境，目标是提升仿真评测和真实 policy performance 的相关性。它的核心方向是用短视频扫描真实场景，再生成可交互仿真环境，使 validation env 更贴近真实 demo 或部署场景。\n\n这篇工作的重要性在于把 real-to-sim 从“手工搭环境”推进到“从真实场景重建评测环境”。如果后续内部 demo 场景逐渐增多，手工维护每个仿真环境会很重；PolaRiS 提供的思路是从真实数据中重建 scene diversity，并用 sim-real correlation 检查这些环境是否真的有评测价值。\n\n对当前阶段来说，PolaRiS 暂时偏重，不适合作为第一阶段主线。但它适合放在第二阶段或第三阶段路线里：当真实场景和任务日志足够稳定后，可探索从真实 demo 自动生成 validation env，并记录 reconstructed scene、scene diversity、unseen scene performance 等字段。","key_points":[],"our_takeaways":[],"cautions":[],"core_content":["使用短视频扫描真实场景，构建可交互仿真环境。","目标是让 real-to-sim evaluation 与真实 policy performance 更相关。"],"metric_ideas":["reconstructed scene evaluation","sim-real correlation","scene diversity","zero-shot evaluation in unseen simulation scenes"],"current_stage_advice":["当前可能太重，但如果未来希望从真实 demo 场景自动生成 validation env，非常值得参考。"],"priority_tiers":["P1","P2"],"priority_label":"P1 / P2","recommended_views":[{"id":"phase2_sim_validation","label":"第二阶段 validation / sim proxy"}],"summary_reasons":[{"view":"第二阶段 validation / sim proxy","text":"从真实短视频重建仿真环境，用于 scalable real-to-sim evaluation。"}],"detail_href":"details/2-3-polaris.html"},{"id":"2.4","stage_id":"2","stage_label":"Real-to-Sim / Validation Proxy","display_name":"RobotArena∞","title":"RobotArena∞: Scalable Robot Benchmarking via Real-to-Sim Translation","year":"2025","type":"real-to-sim translation + human preference benchmark","links":[{"label":"arXiv","key":"arxiv","url":"https://arxiv.org/abs/2510.23571"},{"label":"OpenReview","key":"openreview","url":"https://openreview.net/forum?id=OutljIofvS"}],"arxiv_id":"2510.23571","summary":null,"details":null,"key_points":[],"our_takeaways":[],"cautions":[],"core_content":["将真实机器人 demonstration video 转成仿真环境。","使用自动 VLM scoring 与 human preference comparison。","支持多轴 robustness perturbation。"],"metric_ideas":["VLM-guided scoring","human preference","texture / object placement perturbation","real-to-sim conversion"],"current_stage_advice":["第一阶段不建议直接做。","可以作为未来“人工轻量偏好评测 + 自动打分”的参考。"],"priority_tiers":[],"priority_label":null,"recommended_views":[],"summary_reasons":[],"detail_href":"details/2-4-robotarena.html"},{"id":"2.5","stage_id":"2","stage_label":"Real-to-Sim / Validation Proxy","display_name":"RoboLab","title":"RoboLab: A High-Fidelity Simulation Benchmark for Analysis of Task Generalist Policies","year":"2026","type":"高保真仿真 generalist policy analysis benchmark","links":[{"label":"arXiv","key":"arxiv","url":"https://arxiv.org/abs/2604.09860"}],"arxiv_id":"2604.09860","summary":null,"details":"RoboLab 是高保真仿真 generalist policy analysis benchmark，重点不是复现实机部署流程，而是用大量任务和能力分层来分析 policy 的行为边界。它把任务按 visual、procedural、relational competency 和 difficulty level 分层，适合用于诊断模型在哪类能力上失效。\n\n这篇工作的评测价值在 competency axis。相比只给任务列表，RoboLab 更强调任务为什么难、考察哪种能力、扰动如何控制，以及模型失败是否和特定能力维度相关。这种组织方式适合帮助构建“能力分层 validation set”，让 benchmark 不只是任务堆叠。\n\n对当前项目而言，RoboLab 更适合第二阶段或离线 validation。第一阶段可以先借鉴它的能力轴命名和难度分层，把真实任务标成 visual / procedural / relational 等标签；完整高保真仿真 benchmark 可作为后续诊断工具。","key_points":[],"our_takeaways":[],"cautions":[],"core_content":["RoboLab-120，120 个任务。","任务按 visual、procedural、relational competency 和难度分层。","目标是分析真实 policy 在仿真中的行为、受哪些扰动影响。"],"metric_ideas":["competency axis","difficulty level","controlled perturbation","robustness metrics"],"current_stage_advice":["适合第二阶段设计“能力分层 validation set”。"],"priority_tiers":["P1","P2"],"priority_label":"P1 / P2","recommended_views":[{"id":"phase2_sim_validation","label":"第二阶段 validation / sim proxy"}],"summary_reasons":[{"view":"第二阶段 validation / sim proxy","text":"高保真仿真 + visual/procedural/relational competency 诊断。"}],"detail_href":"details/2-5-robolab.html"},{"id":"2.6","stage_id":"2","stage_label":"Real-to-Sim / Validation Proxy","display_name":"GSWorld","title":"GSWorld: Closed-Loop Photo-Realistic Simulation Suite for Robotic Manipulation","year":"2025","type":"基于 3D Gaussian Splatting 的高保真闭环仿真方向","links":[{"label":"arXiv","key":"arxiv","url":"https://arxiv.org/abs/2510.20813"},{"label":"Project","key":"project","url":"https://3dgsworld.github.io/"}],"arxiv_id":"2510.20813","summary":null,"details":null,"key_points":[],"our_takeaways":[],"cautions":[],"core_content":["将 3D Gaussian Splatting 和物理引擎结合，构建 photo-realistic closed-loop manipulation simulator。","提出 GSDF（Gaussian Scene Description File），将 Gaussian-on-Mesh 表示与 robot URDF / object assets 结合。","支持真实机器人 policy 的可复现仿真评测、sim2real policy training、DAgger 数据收集、虚拟遥操作数据收集和视觉 RL。"],"metric_ideas":[],"current_stage_advice":["暂时作为方向观察，不建议第一阶段纳入指标文档。"],"priority_tiers":[],"priority_label":null,"recommended_views":[],"summary_reasons":[],"detail_href":"details/2-6-gsworld.html"},{"id":"3.1","stage_id":"3","stage_label":"仿真 VLA / Manipulation","display_name":"RoboEval","title":"RoboEval: Where Robotic Manipulation Meets Structured and Scalable Evaluation","year":"2025","type":"仿真 bimanual manipulation structured evaluation","links":[{"label":"arXiv","key":"arxiv","url":"https://arxiv.org/abs/2507.00435"},{"label":"Project","key":"project","url":"https://robo-eval.github.io/"}],"arxiv_id":"2507.00435","summary":null,"details":"RoboEval 是结构化 manipulation evaluation 的代表，核心观点是 binary success 会掩盖大量行为问题。它把任务拆成阶段化执行过程，并用 fine-grained diagnostic metrics 描述失败位置、动作质量和双臂协调等现象，使评测结果更接近“可诊断报告”而不只是排行榜分数。\n\n这篇工作的价值在于 progress 和 behavior quality。真实或仿真任务中，模型可能最终失败，但已经完成了大部分子阶段；也可能最终成功，但轨迹抖动、抓取滑落、双臂不协调或时序不稳定。RoboEval 提醒评测系统需要把 success、stagewise progress、failure localization 和 trajectory/behavior quality 分开记录。\n\n对当前项目而言，RoboEval 的思想应尽早进入 episode schema。第一阶段真机不必实现全部自动化细指标，但可以先人工或半自动记录 `progress_stage`、`failure_stage`、`behavior_quality_note`、`grasp_slip`、`bimanual_coordination_issue` 等字段，避免只留下粗粒度成败。","key_points":[],"our_takeaways":[],"cautions":[],"core_content":["指出 binary success 会掩盖很多行为问题。","提出阶段化任务和 fine-grained diagnostic metrics。","关注双臂协调、滑落、非对称使用、时序一致性等。"],"metric_ideas":["stagewise progress","failure localization","bimanual coordination","trajectory smoothness","grasp slipping","behavioral diagnostics"],"current_stage_advice":["强烈建议借鉴“success + progress + failure stage + behavior quality”的思想。","但第一阶段真机不必实现所有自动化细指标。"],"priority_tiers":["P1"],"priority_label":"P1","recommended_views":[{"id":"phase2_sim_validation","label":"第二阶段 validation / sim proxy"}],"summary_reasons":[{"view":"第二阶段 validation / sim proxy","text":"结构化阶段指标和 failure diagnostic，非常适合借鉴，但很多细指标第一阶段真机不一定能自动采。"}],"detail_href":"details/3-1-roboeval.html"},{"id":"3.2","stage_id":"3","stage_label":"仿真 VLA / Manipulation","display_name":"VLABench","title":"VLABench: A Large-Scale Benchmark for Language-Conditioned Robotics Manipulation with Long-Horizon Reasoning Tasks","year":"2024 / ICCV 2025","type":"语言条件长程 manipulation benchmark","links":[{"label":"arXiv","key":"arxiv","url":"https://arxiv.org/abs/2412.18194"},{"label":"Project","key":"project","url":"https://vlabench.github.io/"},{"label":"GitHub","key":"github","url":"https://github.com/OpenMOSS/VLABench"}],"arxiv_id":"2412.18194","summary":null,"details":null,"key_points":[],"our_takeaways":[],"cautions":[],"core_content":["100 类任务，2000+ objects。","强调世界知识、隐式指令、长程多步推理、语言理解。"],"metric_ideas":["language instruction robustness","implicit intention","spatial relation","semantic instruction","physical law / commonsense"],"current_stage_advice":["当前真机第一阶段可以借鉴指令扰动：同义改写、隐式目标、目标物描述变化。"],"priority_tiers":[],"priority_label":null,"recommended_views":[],"summary_reasons":[],"detail_href":"details/3-2-vlabench.html"},{"id":"3.3","stage_id":"3","stage_label":"仿真 VLA / Manipulation","display_name":"RoboTwin 2.0","title":"RoboTwin 2.0: A Scalable Data Generator and Benchmark with Strong Domain Randomization for Robust Bimanual Robotic Manipulation","year":"2025","type":"双臂仿真 benchmark / data generator","links":[{"label":"arXiv","key":"arxiv","url":"https://arxiv.org/abs/2506.18088"},{"label":"Project","key":"project","url":"https://rob ways":[],"cautions":[],"core_content":["自动生成多样化 manipulation scenes 测试 VLA。","评估 camera pose、lighting、unseen objects 等因素。"],"metric_ideas":["fuzzing scene generation","camera/lighting/object robustness","large-scale stress test"],"current_stage_advice":["第二阶段做 robustness stress test 时可参考。"],"priority_tiers":[],"priority_label":null,"recommended_views":[],"summary_reasons":[],"detail_href":"details/3-17-vlatest.html"},{"id":"3.18","stage_id":"3","stage_label":"仿真 VLA / Manipulation","display_name":"ROBOGATE","title":"ROBOGATE: Adaptive Failure Discovery for Safe Robot Policy Deployment via Two-Stage Boundary-Focused Sampling","year":"2026","type":"部署前 failure discovery / risk validation","links":[{"label":"arXiv","key":"arxiv","url":"https://arxiv.org/abs/2603.22126"},{"label":"arXiv HTML","key":"arxiv_html","url":"https://arxiv.org/html/2603.22126v2"}],"arxiv_id":"2603.22126","summary":null,"details":null,"key_points":[],"our_takeaways":[],"cautions":[],"core_content":["使用两阶段采样寻找 failure boundaries。","先粗采样，再在 30–70% success transition zone 重点采样。"],"metric_ideas":["failure boundary","adversarial scenario discovery","risk model AUC","deployment validation"],"current_stage_advice":["不适合第一阶段，但适合未来上线前做风险边界测试。"],"priority_tiers":[],"priority_label":null,"recommended_views":[],"summary_reasons":[],"detail_href":"details/3-18-robogate.html"},{"id":"3.19","stage_id":"3","stage_label":"仿真 VLA / Manipulation","display_name":"vla-eval","title":"vla-eval: A Unified Evaluation Harness for Vision-Language-Action Models","year":"2026","type":"统一 VLA evaluation harness / infrastructure","links":[{"label":"arXiv","key":"arxiv","url":"https://arxiv.org/abs/2603.13966"},{"label":"GitHub","key":"github","url":"https://github.com/allenai/vla-evaluation-harness"}],"arxiv_id":"2603.13966","summary":null,"details":null,"key_points":[],"our_takeaways":[],"cautions":[],"core_content":["用 WebSocket/msgpack 协议解耦 model inference 和 benchmark execution。","支持 13 个 simulation benchmarks 和多个 model servers。","用 Docker 隔离环境，减少依赖冲突。"],"metric_ideas":["model server abstraction","benchmark runner abstraction","episode sharding","reproducibility audit"],"current_stage_advice":["如果需要做内部多模型统一评测，很值得参考架构设计。"],"priority_tiers":[],"priority_label":null,"recommended_views":[],"summary_reasons":[],"detail_href":"details/3-19-vla-eval.html"},{"id":"4.1","stage_id":"4","stage_label":"WAM / Embodied World Model","display_name":"WorldArena","title":"WorldArena: A Unified Benchmark for Evaluating Perception and Functional Utility of Embodied World Models","year":"2026","type":"embodied world model 综合 benchmark","links":[{"label":"arXiv","key":"arxiv","url":"https://arxiv.org/abs/2602.08971"},{"label":"Project / Leaderboard","key":"project_leaderboard","url":"https://worldarena.ai"},{"label":"GitHub","key":"github","url":"https://github.com/tsinghua-fib-lab/WorldArena"}],"arxiv_id":"2602.08971","summary":null,"details":"WorldArena 是 embodied world model 的综合 benchmark，试图同时评估 perception quality 和 functional utility。它的重要判断是：世界模型生成的视频看起来合理，并不等于它对机器人决策、数据生成、policy evaluation 或 action planning 有用。\n\n这篇工作的价值在于把 WAM 评测拆成两层。第一层是视觉和物理层面的 perception quality，例如场景一致性、物理合理性和指令跟随；第二层是 functional utility，例如能否作为 data engine、policy evaluator 或 action planner。EWMScore 这样的综合分数背后，真正值得借鉴的是 perception-functionality gap 这个问题定义。\n\n对当前项目而言，WorldArena 不适合作为第一阶段真机主指标，但非常适合 WAM 第二/第三阶段。后续如果加入 world model 分支，应同时记录视觉质量、物理一致性、policy ranking utility、planning utility 和 human evaluation，而不是只看生成效果。","key_points":[],"our_takeaways":[],"cautions":[],"core_content":["同时评估 embodied world model 的 perception quality 和 functional utility。","perception quality 包含 6 个子维度、16 个指标。","functional utility 包括 data engine、policy evaluator、action planner。","提出 EWMScore。","强调 perception-functionality gap：视频看起来好，不代表对机器人决策有用。"],"metric_ideas":["video perception quality","physics adherence","instruction following","data engine utility","policy evaluator utility","action planner utility","human evaluation"],"current_stage_advice":["不建议作为第一阶段主指标。","WAM 第二/第三阶段评测中应该重点参考。"],"priority_tiers":["P1","P2"],"priority_label":"P1 / P2","recommended_views":[{"id":"wam_world_model","label":"WAM / world model 专属评测"}],"summary_reasons":[{"view":"WAM / world model 专属评测","text":"同时评估 perception quality 和 functional utility；强调 perception-functionality gap。"}],"detail_href":"details/4-1-worldarena.html"},{"id":"4.2","stage_id":"4","stage_label":"WAM / Embodied World Model","display_name":"RoboWM-Bench","title":"RoboWM-Bench: A Benchmark for Evaluating World Models in Robotic Manipulation","year":"2026","type":"robotic manipulation world model 可执行性评测","links":[{"label":"arXiv","key":"arxiv","url":"https://arxiv.org/abs/2604.19092"},{"label":"GitHub","key":"github","url":"https://github.com/fffstrong/RoboWM-Bench"}],"arxiv_id":"2604.19092","summary":null,"details":"RoboWM-Bench 是面向 robotic manipulation world model 的可执行性评测，核心问题是 world model 生成的未来视频或行为是否能转化成机器人可执行动作。它把关注点从“视频是否逼真”推进到“预测是否物理可行、接触是否稳定、动作是否能完成任务”。\n\n这篇工作对 WAM 评测非常关键，因为 manipulation 任务中的错误往往出现在接触、空间关系和动作可执行性上。一个 world model 可能生成视觉上合理的帧，但如果物体接触、抓取、放置或中间状态不满足物理约束，就不能真正服务于 policy 或 planner。\n\n对当前 benchmark reference 来说，RoboWM-Bench 适合后续 WAM 诊断页。建议在 WAM 输出中预留 step-level executability、task-level executability、physical plausibility、spatial reasoning error、contact prediction stability 等字段，避免把视频质量误当成机器人可用性。","key_points":[],"our_takeaways":[],"cautions":[],"core_content":["关注 generated videos / behaviors 是否能转成 embodied actions 并执行成功。","不只看视觉质量，而是看物理可执行性。"],"metric_ideas":["step-level executability","task-level executability","physical plausibility","spatial reasoning error","contact prediction stability"],"current_stage_advice":["非常适合 WAM 后续诊断：预测未来不仅要“像”，还要“可执行”。"],"priority_tiers":["P1","P2"],"priority_label":"P1 / P2","recommended_views":[{"id":"wam_world_model","label":"WAM / world model 专属评测"}],"summary_reasons":[{"view":"WAM / world model 专属评测","text":"关注生成行为是否能转成可执行 robot actions，而不只是视频好看。"}],"detail_href":"details/4-2-robowm-bench.html"},{"id":"4.3","stage_id":"4","stage_label":"WAM / Embodied World Model","display_name":"WorldEval","title":"WorldEval: World Model as Real-World Robot Policies Evaluator","year":"2025","type":"world model 作为 policy evaluator","links":[{"label":"arXiv","key":"arxiv","url":"https://arxiv.org/abs/2505.19017"},{"label":"GitHub","key":"github","url":"https://github.com/liyaxuanliyaxuan/Worldeval"}],"arxiv_id":"2505.19017","summary":null,"details":"WorldEval 把 world model 用作真实机器人 policy evaluator，关注它是否能预测不同 policy 或 checkpoint 在真实环境中的表现。它的核心价值不是生成未来画面本身，而是把 WAM 变成评测 proxy，看 predicted success、risk 或 ranking 是否和真实 rollout 结果相关。\n\n这篇工作适合回答一个关键问题：如果未来内部系统引入 WAM，WAM 分数到底能不能替代一部分真机评测成本。只有当 predicted success、checkpoint ranking、safety prediction 和 real-world result 之间有稳定相关性时，WAM evaluator 才能成为可信 validation 工具。\n\n对当前项目而言，WorldEval 提示从早期就可以保存并行字段。即使 WAM 还没有进入闭环控制，也可以记录 `wam_predicted_success`、`wam_predicted_progress`、`wam_risk_score` 与真实 `real_success`、`real_progress`，后续用 ranking agreement 和 correlation 来验证 WAM proxy。","key_points":[],"our_takeaways":[],"cautions":[],"core_content":["使用 world model 作为真实机器人 policy evaluation 的 proxy。","关注 world model 是否能预测不同 policy / checkpoint 的真实表现。","也可作为 safety detector。"],"metric_ideas":["policy ranking agreement","checkpoint ranking agreement","predicted success vs actual success","safety prediction","real-world correlation"],"current_stage_advice":["如果 WAM 输出 predicted success/risk，可以先存下来，为未来做 WorldEval 式相关性分析做准备。"],"priority_tiers":["P1","P2"],"priority_label":"P1 / P2","recommended_views":[{"id":"wam_world_model","label":"WAM / world model 专属评测"}],"summary_reasons":[{"view":"WAM / world model 专属评测","text":"world model 作为 policy/checkpoint evaluator，看与真机结果相关性。"}],"detail_href":"details/4-3-worldeval.html"},{"id":"4.4","stage_id":"4","stage_label":"WAM / Embodied World Model","display_name":"EWMBench","title":"EWMBench: Evaluating Scene, Motion, and Semantic Quality in Embodied World Models","year":"2025","type":"embodied world model 生成质量评测","links":[{"label":"arXiv","key":"arxiv","url":"https://arxiv.org/abs/2505.09694"},{"label":"GitHub","key":"github","url":"https://github.com/AgibotTech/EWMBench"},{"label":"HuggingFace Dataset","key":"huggingface_dataset","url":"https://huggingface.co/datasets/agibot-world/EWMBench"}],"arxiv_id":"2505.09694","summary":null,"details":null,"key_points":[],"our_takeaways":[],"cautions":[],"core_content":["评估 embodied world model 在 scene consistency、motion correctness、semantic alignment 上的表现。"],"metric_ideas":["visual scene consistency","motion correctness","semantic alignment"],"current_stage_advice":["更偏视频/世界模型质量，不应作为真机主指标。","可用于 WAM 感知侧诊断。"],"priority_tiers":["P2"],"priority_label":"P2","recommended_views":[{"id":"wam_world_model","label":"WAM / world model 专属评测"}],"summary_reasons":[{"view":"WAM / world model 专属评测","text":"评估 embodied video/world model 的视觉、物理、语义、执行一致性。"}],"detail_href":"details/4-4-ewmbench.html"},{"id":"4.5","stage_id":"4","stage_label":"WAM / Embodied World Model","display_name":"RBench / RoVid-X","title":"Rethinking Video Generation Model for the Embodied World / RBench","year":"2026","type":"robot-oriented video generation benchmark","links":[{"label":"arXiv","key":"arxiv","url":"https://arxiv.org/abs/2601.15282"},{"label":"Project","key":"project","url":"https://dagroup-pku.github.io/ReVidgen.github.io/"},{"label":"GitHub","key":"github","url":"https://github.com/DAGroup-PKU/ReVidgen/"}],"arxiv_id":"2601.15282","summary":null,"details":null,"key_points":[],"our_takeaways":[],"cautions":[],"core_content":["RBench 用于评估 robot-oriented video generation。","覆盖 5 个任务域、4 种 embodiments。","指标包括 structural consistency、physical plausibility、action completeness。","同时提出 RoVid-X 大规模机器人视频生成数据集。"],"metric_ideas":["structural consistency","physical plausibility","action completeness","human evaluation correlation"],"current_stage_advice":["WAM 视觉生成质量可参考；真机控制主指标不建议直接用。"],"priority_tiers":["P2"],"priority_label":"P2","recommended_views":[{"id":"wam_world_model","label":"WAM / world model 专属评测"}],"summary_reasons":[{"view":"WAM / world model 专属评测","text":"评估 embodied video/world model 的视觉、物理、语义、执行一致性。"}],"detail_href":"details/4-5-rbench-rovid-x.html"},{"id":"4.6","stage_id":"4","stage_label":"WAM / Embodied World Model","display_name":"WoW-World-Eval","title":"Wow, wo, val! A Comprehensive Embodied World Model Evaluation Turing Test","year":"2026","type":"embodied world model Turing-test style benchmark","links":[{"label":"arXiv","key":"arxiv","url":"https://arxiv.org/abs/2601.04137"}],"arxiv_id":"2601.04137","summary":null,"details":null,"key_points":[],"our_takeaways":[],"cautions":[],"core_content":["提出 WoW-World-Eval，测试 embodied world model 的 perception、planning、prediction、generalization、execution 五类能力。","包括 Human Turing Test 和 IDM Turing Test。"],"metric_ideas":["human preference","IDM execution accuracy","long-horizon planning","physical consistency"],"current_stage_advice":["更适合 WAM 第三阶段评测。"],"priority_tiers":["P2"],"priority_label":"P2","recommended_views":[{"id":"wam_world_model","label":"WAM / world model 专属评测"}],"summary_reasons":[{"view":"WAM / world model 专属评测","text":"评估 embodied video/world model 的视觉、物理、语义、执行一致性。"}],"detail_href":"details/4-6-wow-world-eval.html"},{"id":"4.7","stage_id":"4","stage_label":"WAM / Embodied World Model","display_name":"MIND","title":"MIND: Benchmarking Memory Consistency and Action Control in World Models","year":"2026","type":"world model memory consistency / action control benchmark","links":[{"label":"arXiv","key":"arxiv","url":"https://arxiv.org/abs/2602.08025"},{"label":"Project","key":"project","url":"https://csu-jpg.github.io/MIND.github.io/"}],"arxiv_id":"2602.08025","summary":null,"details":null,"key_points":[],"our_takeaways":[],"cautions":[],"core_content":["评估 world model 的 long-context memory consistency 和 action control。","open-domain closed-loop revisited benchmark。"],"metric_ideas":["long-context memory consistency","action control","revisiting previous scene consistency"],"current_stage_advice":["不是机器人 manipulation 专用，但对 WAM 长程一致性指标有启发。"],"priority_tiers":[],"priority_label":null,"recommended_views":[],"summary_reasons":[],"detail_href":"details/4-7-mind.html"},{"id":"4.8","stage_id":"4","stage_label":"WAM / Embodied World Model","display_name":"IRASim","title":"IRASim: Learning Interactive Real-Robot Action Simulators","year":"2024 / ICCV 2025","type":"real-robot action-conditioned video simulator / world model benchmark","links":[{"label":"arXiv","key":"arxiv","url":"https://arxiv.org/abs/2406.14540"},{"label":"Project","key":"project","url":"https://gen-irasim.github.io/"}],"arxiv_id":"2406.14540","summary":null,"details":null,"key_points":[],"our_takeaways":[],"cautions":[],"core_content":["给定初始帧和 action trajectory，生成机器人执行动作的视频。","创建 IRASim Benchmark，基于三个真实机器人数据集。","关注 trajectory-conditioned video generation，并展示在 policy evaluation / policy improvement 上的用途。"],"metric_ideas":["action-conditioned prediction","video-realism human preference","policy evaluation correlation"],"current_stage_advice":["如果 WAM 输入 action chunk 并预测 future frame，可参考 IRASim 的 action-conditioned simulator 评估方式。"],"priority_tiers":[],"priority_label":null,"recommended_views":[],"summary_reasons":[],"detail_href":"details/4-8-irasim.html"},{"id":"4.9","stage_id":"4","stage_label":"WAM / Embodied World Model","display_name":"DreamZero","title":"World Action Models are Zero-shot Policies / DreamZero","year":"2026","type":"WAM policy + 真实机器人评测 / 工业界系统论文","links":[{"label":"arXiv","key":"arxiv","url":"https://arxiv.org/abs/2602.15922"},{"label":"Project","key":"project","url":"https://dreamzero0.github.io/"}],"arxiv_id":"2602.15922","summary":"DreamZero 是 NVIDIA 的 WAM-as-policy 系统：用大规模 video diffusion backbone 联合预测未来视频和连续动作，证明 WAM 不只是 policy evaluator 或 simulator，也可以直接作为 zero-shot / post-trained robot policy 进入真实闭环。","details":"DreamZero 是 NVIDIA 的 WAM-as-policy 系统论文，定位比普通 world model benchmark 更激进：它不仅让模型预测未来世界状态，还让 WAM 直接输出连续动作，进入真实机器人闭环。它把大规模 video diffusion backbone、future state prediction 和 action prediction 结合起来，验证 WAM 可以作为 zero-shot 或 post-trained policy。\n\n这篇工作的评测价值在于把 WAM 拉回真实任务表现。与只评估视频质量的 embodied world model 不同，DreamZero 关注 task progress、unseen task/environment/object、cross-embodiment transfer、post-training data efficiency 和 closed-loop latency。DreamZero-Flash 对推理速度的强调也说明 WAM 进入控制闭环后，latency 和 success/progress 同样重要。\n\n对当前项目而言，DreamZero 是 WAM 最终形态的工业参考。第一阶段不需要部署 WAM policy，但应从现在开始保留 task progress、latency、failure type、safety event 等字段；如果后续加入 WAM 预测分支，也应把 predicted success / predicted progress 与真实 rollout 结果并行保存。","key_points":["这是 WAM 真机评测的关键工业参考：它把 `task progress`、unseen task/env/object、cross-embodiment transfer 和 latency 都放进系统评估。","与只评估视频质量的 world model 不同，DreamZero 直接看真实机器人任务进度和闭环控制表现。","DreamZero-Flash 强调推理速度，提示 WAM 评测必须同时记录 success/progress 与 control latency。"],"our_takeaways":["如果未来 WAM 直接出 action，必须按真实任务 success、partial progress、failure type、latency、safety event 评估。","如果 WAM 先作为 evaluator，也应该保存 `wam_predicted_success`、`wam_score` 与真实 rollout 结果，后续检查 ranking correlation。","对跨本体或少样本适配，要单独记录 source embodiment、target embodiment、adaptation data minutes / trajectories。"],"cautions":["这是系统论文，不是独立 benchmark；结果依赖大规模工业数据、模型规模和高端推理硬件。","第一阶段不应直接照搬 WAM policy 部署难度，但它给了 WAM 最终应该被怎样测量的方向。"],"core_content":["基于大规模 video diffusion backbone 构建约 14B WAM，同时预测未来 world states 和 actions。","在 AgiBot、DROID-Franka 等真实机器人数据与任务上验证 zero-shot、post-training、cross-embodiment 和 few-shot embodiment adaptation。","提出 DreamZero-Flash 加速推理，降低闭环控制延迟。"],"metric_ideas":["unseen task/environment/object success","task progress","real-time closed-loop control latency","cross-embodiment transfer","post-training data efficiency","WAM-as-policy vs WAM-as-evaluator comparison"],"current_stage_advice":["第一阶段不需要部署 DreamZero 式 WAM policy，但应该从现在开始记录 task progress 和 latency。","如果后续加 WAM 预测分支，建议把 predicted success / predicted progress 与真实结果并行保存。"],"priority_tiers":["P1"],"priority_label":"P1","recommended_views":[{"id":"wam_world_model","label":"WAM / world model 专属评测"},{"id":"industrial_systems","label":"工业界系统论文参考"}],"summary_reasons":[{"view":"WAM / world model 专属评测","text":"不是纯 benchmark，但对 WAM 该如何设计真实任务评测很有启发。"},{"view":"工业界系统论文参考","text":"参考 WAM 直接作为 zero-shot policy 时，如何记录 task progress、OOD generalization、cross-embodiment transfer 和 latency。"}],"detail_href":"details/4-9-dreamzero.html"},{"id":"4.10","stage_id":"4","stage_label":"WAM / Embodied World Model","display_name":"Fast-WAM","title":"Fast-WAM: Do World Action Models Need Test-time Future Imagination?","year":"2026","type":"WAM 推理机制 / latency-performance tradeoff","links":[{"label":"arXiv","key":"arxiv","url":"https://arxiv.org/abs/2603.16666"},{"label":"Project","key":"project","url":"https://yuantianyuan01.github.io/FastWAM/"}],"arxiv_id":"2603.16666","summary":null,"details":"Fast-WAM 关注 WAM 推理机制中的 latency-performance tradeoff，核心问题是 world action model 是否需要在 test time 显式生成未来 imagination，还是 video co-training 已经提供了主要收益。它把 WAM 从“能不能预测未来”推进到“预测未来是否值得付出闭环控制延迟”的系统问题。\n\n这篇工作的评测价值在于把 action performance、inference latency、video co-training ablation 和 explicit future generation ablation 放在一起看。对机器人控制来说，慢但看起来合理的未来预测未必有用；如果推理延迟破坏闭环频率，最终 task success 可能下降。\n\n对当前 benchmark reference 来说，Fast-WAM 是 WAM 真实部署前需要纳入考虑的参考。后续 WAM 评测应记录 latency、control Hz、是否显式生成未来、是否使用 video co-training，以及这些设计对真实或仿真 task performance 的影响。","key_points":[],"our_takeaways":[],"cautions":[],"core_content":["探讨 WAM 是否需要 test-time future imagination。","发现 video co-training 的价值可能大于推理时显式生成未来。","在 LIBERO、RoboTwin 和真实任务上评估，强调 latency。"],"metric_ideas":["action performance","inference latency","video co-training ablation","explicit future generation ablation"],"current_stage_advice":["WAM 评测一定要记录 latency，不能只看成功率。"],"priority_tiers":["P1"],"priority_label":"P1","recommended_views":[{"id":"wam_world_model","label":"WAM / world model 专属评测"}],"summary_reasons":[{"view":"WAM / world model 专属评测","text":"不是纯 benchmark，但对 WAM 该如何设计真实任务评测很有启发。"}],"detail_href":"details/4-10-fast-wam.html"},{"id":"4.11","stage_id":"4","stage_label":"WAM / Embodied World Model","display_name":"OA-WAM","title":"OA-WAM: Object-Addressable World Action Model for Robust Robot Manipulation","year":"2026","type":"object-addressable WAM / robustness evaluation","links":[{"label":"arXiv","key":"arxiv","url":"https://arxiv.org/abs/2605.06481"}],"arxiv_id":"2605.06481","summary":null,"details":"OA-WAM 是 object-addressable world action model 方向的代表，核心问题是 holistic image/video tokens 不容易精确指向目标物体，导致 manipulation 中的对象绑定和几何鲁棒性不足。它用 object slots 表示机器人和物体状态，希望让 WAM 在目标对象、空间关系和动作后果上更可控。\n\n这篇工作对评测系统的价值在 wrong-object failure 和 object binding。很多 manipulation 失败不是动作完全无效，而是抓错物体、关注错对象、或在几何扰动下对象关系漂移。OA-WAM 提示 WAM/VLA 评测需要单独记录目标对象寻址、slot intervention、geometric robustness 和 object binding error。\n\n对当前项目而言，OA-WAM 适合后续 WAM/VLA 统一诊断。如果真实任务中出现抓错物体、忽略目标物、误操作相邻物体等现象，应在日志里保留 `target_object_id`、`acted_object_id`、`wrong_object_failure`、`object_binding_confidence` 等字段。","key_points":[],"our_takeaways":[],"cautions":[],"core_content":["使用 object slots 表示机器人和物体状态。","目标是解决 holistic image/video token 对目标物体不易寻址的问题。","在 LIBERO、SimplerEnv、LIBERO-Plus 等上评估。"],"metric_ideas":["object binding","slot intervention test","geometric robustness","target-object addressability"],"current_stage_advice":["如果 WAM/VLA 经常抓错物体，可以参考 object binding / wrong-object failure 的记录方式。"],"priority_tiers":["P1"],"priority_label":"P1","recommended_views":[{"id":"wam_world_model","label":"WAM / world model 专属评测"}],"summary_reasons":[{"view":"WAM / world model 专属评测","text":"不是纯 benchmark，但对 WAM 该如何设计真实任务评测很有启发。"}],"detail_href":"details/4-11-oa-wam.html"},{"id":"4.12","stage_id":"4","stage_label":"WAM / Embodied World Model","display_name":"WAM Robustness Study","title":"Do World Action Models Generalize Better than VLAs? A Robustness Study","year":"2026","type":"VLA vs WAM robustness benchmark study","links":[{"label":"arXiv","key":"arxiv","url":"https://arxiv.org/abs/2603.22078"}],"arxiv_id":"2603.22078","summary":null,"details":null,"key_points":[],"our_takeaways":[],"cautions":[],"core_content":["在 LIBERO-Plus 和 RoboTwin 2.0-Plus 上比较 VLA 与 WAM 的鲁棒性。","测试 visual 和 language perturbations。"],"metric_ideas":["perturbation-specific success","VLA/WAM robustness comparison","language perturbation","visual perturbation"],"current_stage_advice":["可用于设计 VLA/WAM 统一对比时的 robustness matrix。"],"priority_tiers":[],"priority_label":null,"recommended_views":[],"summary_reasons":[],"detail_href":"details/4-12-wam-robustness-study.html"},{"id":"4.13","stage_id":"4","stage_label":"WAM / Embodied World Model","display_name":"DreamDojo","title":"DreamDojo: A Generalist Robot World Model from Large-Scale Human Videos","year":"2026","type":"工业界 generalist robot world model / WAM evaluator、planner、teleoperation simulator 参考","links":[{"label":"arXiv","key":"arxiv","url":"https://arxiv.org/abs/2602.06949"},{"label":"Project","key":"project","url":"https://dreamdojo-world.github.io/"}],"arxiv_id":"2602.06949","summary":"DreamDojo 是 NVIDIA 的 generalist robot world model，核心是用约 44k 小时大规模 egocentric human videos 预训练世界模型，再用小规模目标机器人数据 post-train，使其可用于 live teleoperation、policy evaluation 和 model-based planning。","details":"DreamDojo 是 NVIDIA 的 generalist robot world model 系统论文，定位是把大规模 egocentric human videos 转化为机器人可用的世界模型能力。它先用约 44k 小时人类视频进行预训练，再用小规模目标机器人数据 post-train，使 world model 可用于 live teleoperation、policy evaluation 和 model-based planning。\n\n这篇工作的关键在 latent actions 和应用验证。由于人类视频没有机器人 action 标注，DreamDojo 用 continuous latent actions 作为统一 proxy action，让模型学到可控的未来预测。评测上，它不只看生成质量，还关注推理速度、真实 policy evaluation 相关性、planning 是否改善下游策略，以及长程 rollout 的上下文一致性。\n\n对当前项目而言，DreamDojo 适合作为 WAM 第二/第三阶段的工业参考。它提示如果未来用 WAM 做 sim proxy 或 planner，应同时保存 `predicted_success`、`predicted_progress`、`real_success`、`real_progress`、inference FPS、controllability 和 ranking agreement；人类视频可作为预训练资产，但目标机器人 post-training 和真实相关性验证仍然需要单独保留。","key_points":["它不是 benchmark，但对 WAM 第二/第三阶段非常重要：它示范了 world model 如何作为 policy evaluator 和 planner，而不只是生成好看的视频。","论文通过 latent actions 把无动作标注的人类视频转成可控世界模型训练信号，适合参考“人类视频如何进入机器人 world model”。","它报告了推理速度和真实 policy evaluation 相关性，适合指导后续验证 WAM proxy 是否真的预测真机表现。"],"our_takeaways":["如果后续用 WAM 做 sim proxy，应保存 `predicted_success`、`predicted_progress`、`real_success`、`real_progress`，并计算 policy/checkpoint ranking agreement。","对 world model 输出，应同时记录视觉一致性、动作可控性、长程上下文一致性和推理 FPS。","人类视频数据可以作为 world model 预训练资产，但目标机器人 post-training 和真实相关性验证仍然不可省。"],"cautions":["DreamDojo 更偏 WAM 基础设施和应用验证，不适合作为第一阶段真机 demo 的主指标。","大规模人类视频预训练、H100 级训练资源和目标机器人 post-training 都有较高门槛。"],"core_content":["使用约 44k 小时 egocentric human videos 进行 world model pretraining。","用 continuous latent actions 作为未标注人类视频中的统一 proxy action。","在 Unitree G1、Fourier GR-1、AgiBot、YAM 等目标机器人数据上 post-train。","展示 live teleoperation、policy evaluation 和 model-based planning 三类应用。","蒸馏后推理速度可到 10 FPS 量级，用于改善交互和长程 rollout。"],"metric_ideas":["policy evaluation correlation with real-world success","predicted vs actual task progress","context consistency over long rollouts","controllability under latent actions","inference FPS / latency","planning improvement over baseline policies"],"current_stage_advice":["第一阶段先不把 DreamDojo 当主线，但要把 `predicted_vs_actual_success` 这类字段留到 WAM 阶段。","如果后续做 WAM 页面，DreamDojo 应和 DreamZero 一起作为 NVIDIA 工业参考：一个更偏 world model/evaluator/planner，一个更偏 WAM-as-policy。"],"priority_tiers":["P1"],"priority_label":"P1","recommended_views":[{"id":"industrial_systems","label":"工业界系统论文参考"}],"summary_reasons":[{"view":"工业界系统论文参考","text":"参考 WAM 作为 policy evaluator / planner / teleoperation simulator 时，如何验证 real-world correlation 和推理速度。"}],"detail_href":"details/4-13-dreamdojo.html"}],"html":{"public":true}}</script>
  <script>
    const payload = JSON.parse(document.getElementById("benchmark-data").textContent);
    const records = payload.records;
    const isPublic = Boolean(payload.html && payload.html.public);
    const state = {
      view: "all",
      query: "",
      stage: "all",
      priority: "all",
      sort: "source",
    };

    const iconMap = {
      external: '<svg class="icon" viewBox="0 0 24 24"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M21 14v6H3V3h6"/></svg>',
      pdf: '<svg class="icon" viewBox="0 0 24 24"><path d="M14 3v4a2 2 0 0 0 2 2h4"/><path d="M6 3h8l6 6v12H6z"/><path d="M9 17h6M9 13h6"/></svg>',
      check: '<svg class="icon" viewBox="0 0 24 24"><path d="m20 6-11 11-5-5"/></svg>',
      alert: '<svg class="icon" viewBox="0 0 24 24"><path d="M12 9v4"/><path d="M12 17h.01"/><path d="M10.3 4.3 2.6 18a2 2 0 0 0 1.7 3h15.4a2 2 0 0 0 1.7-3L13.7 4.3a2 2 0 0 0-3.4 0z"/></svg>',
      summary: '<svg class="icon" viewBox="0 0 24 24"><path d="M8 6h13"/><path d="M8 12h13"/><path d="M8 18h9"/><path d="M3 6h.01"/><path d="M3 12h.01"/><path d="M3 18h.01"/></svg>',
      details: '<svg class="icon" viewBox="0 0 24 24"><path d="M14 3v4a2 2 0 0 0 2 2h4"/><path d="M6 3h8l6 6v12H6z"/><path d="M10 13h4"/><path d="M10 17h6"/></svg>',
    };

    const stageOrder = ["1", "2", "3", "4"];
    const stageLabels = new Map(records.map((record) => [record.stage_id, record.stage_label]));
    const collator = new Intl.Collator("zh-Hans-CN", { numeric: true, sensitivity: "base" });

    function byId(id) {
      return document.getElementById(id);
    }

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, (char) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;",
      }[char]));
    }

    function normalize(value) {
      return String(value ?? "").toLowerCase();
    }

    function countBy(items, getter) {
      const counts = new Map();
      for (const item of items) {
        const key = getter(item);
        counts.set(key, (counts.get(key) || 0) + 1);
      }
      return counts;
    }

    function viewCount(viewId) {
      if (viewId === "all") return records.length;
      return records.filter((record) => record.recommended_views.some((view) => view.id === viewId)).length;
    }

    function priorityRank(record) {
      const tiers = record.priority_tiers || [];
      if (tiers.includes("P0")) return 0;
      if (tiers.includes("P1")) return 1;
      if (tiers.includes("P2")) return 2;
      return 3;
    }

    function priorityLabel(record) {
      return record.priority_label || "未标注";
    }



    function searchableText(record) {
      return [
        record.id,
        record.display_name,
        record.title,
        record.year,
        record.type,
        record.stage_label,
        record.arxiv_id,
        priorityLabel(record),
        record.core_content.join(" "),
        record.metric_ideas.join(" "),
        record.current_stage_advice.join(" "),
        record.summary || "",
        record.details || "",
        (record.key_points || []).join(" "),
        (record.our_takeaways || []).join(" "),
        (record.cautions || []).join(" "),
        record.summary_reasons.map((reason) => reason.text).join(" "),
      ].join(" ").toLowerCase();
    }

    function recordMatches(record) {
      if (state.view !== "all" && !record.recommended_views.some((view) => view.id === state.view)) {
        return false;
      }
      if (state.stage !== "all" && record.stage_id !== state.stage) {
        return false;
      }
      if (state.priority !== "all") {
        const tiers = record.priority_tiers || [];
        if (state.priority === "unassigned" && tiers.length > 0) return false;
        if (state.priority !== "unassigned" && !tiers.includes(state.priority)) return false;
      }

      if (state.query && !searchableText(record).includes(state.query)) {
        return false;
      }
      return true;
    }

    function sortedRecords(items) {
      const list = [...items];
      list.sort((a, b) => {
        if (state.sort === "priority") {
          return priorityRank(a) - priorityRank(b) || collator.compare(a.id, b.id);
        }
        if (state.sort === "stage") {
          return Number(a.stage_id) - Number(b.stage_id) || priorityRank(a) - priorityRank(b) || collator.compare(a.id, b.id);
        }
        if (state.sort === "year") {
          return Number(b.year || 0) - Number(a.year || 0) || collator.compare(a.id, b.id);
        }
        return collator.compare(a.id, b.id);
      });
      return list;
    }

    function renderOptions(select, options, selected) {
      select.innerHTML = options.map((option) => {
        const active = option.value === selected ? " selected" : "";
        return `<option value="${escapeHtml(option.value)}"${active}>${escapeHtml(option.label)}</option>`;
      }).join("");
    }

    function renderControls() {
      const stageCounts = countBy(records, (record) => record.stage_id);
      const stageOptions = [
        { value: "all", label: `全部阶段 (${records.length})` },
        ...stageOrder.map((stageId) => ({
          value: stageId,
          label: `${stageLabels.get(stageId)} (${stageCounts.get(stageId) || 0})`,
        })),
      ];
      renderOptions(byId("stageFilter"), stageOptions, state.stage);

      const priorityOptions = [
        { value: "all", label: "全部优先级" },
        { value: "P0", label: `P0 (${records.filter((record) => record.priority_tiers.includes("P0")).length})` },
        { value: "P1", label: `P1 (${records.filter((record) => record.priority_tiers.includes("P1")).length})` },
        { value: "P2", label: `P2 (${records.filter((record) => record.priority_tiers.includes("P2")).length})` },
        { value: "unassigned", label: `未标注 (${records.filter((record) => record.priority_tiers.length === 0).length})` },
      ];
      renderOptions(byId("priorityFilter"), priorityOptions, state.priority);



      byId("sortMode").value = state.sort;
      byId("viewTabs").innerHTML = payload.views.map((view) => {
        const active = view.id === state.view ? "true" : "false";
        return `<button class="view-tab" type="button" data-view="${escapeHtml(view.id)}" aria-pressed="${active}">
          <span>${escapeHtml(view.label)}</span>
          <span class="view-count">${viewCount(view.id)}</span>
        </button>`;
      }).join("");
    }

    function renderMetrics(filtered) {
      const p0 = filtered.filter((record) => record.priority_tiers.includes("P0")).length;
      const p1 = filtered.filter((record) => record.priority_tiers.includes("P1")).length;
      const wam = filtered.filter((record) => record.stage_id === "4").length;
      const realWorld = filtered.filter((record) => record.stage_id === "1").length;

      const metrics = [
        ["可见条目", filtered.length],
        ["P0 / P1", `${p0} / ${p1}`],
        ["真机评测", realWorld],
        ["WAM 条目", wam],
      ];

      byId("metricStrip").innerHTML = metrics.map(([label, value]) => `
        <div class="metric">
          <span class="metric-value">${escapeHtml(value)}</span>
          <span class="metric-label">${escapeHtml(label)}</span>
        </div>
      `).join("");
    }

    function renderChart(container, rows, cssPrefix) {
      const max = Math.max(1, ...rows.map((row) => row.count));
      container.innerHTML = rows.map((row) => `
        <div class="bar-row">
          <span class="bar-label" title="${escapeHtml(row.label)}">${escapeHtml(row.label)}</span>
          <span class="bar-track"><span class="bar-fill ${cssPrefix}${escapeHtml(row.key)}-fill" style="width: ${Math.round((row.count / max) * 100)}%"></span></span>
          <span class="bar-value">${row.count}</span>
        </div>
      `).join("");
    }

    function renderCharts(filtered) {
      const stageCounts = countBy(filtered, (record) => record.stage_id);
      renderChart(
        byId("stageChart"),
        stageOrder.map((stageId) => ({
          key: stageId,
          label: stageLabels.get(stageId),
          count: stageCounts.get(stageId) || 0,
        })),
        "stage-",
      );

      const priorityRows = [
        { key: "p0", label: "P0", count: filtered.filter((record) => record.priority_tiers.includes("P0")).length },
        { key: "p1", label: "P1", count: filtered.filter((record) => record.priority_tiers.includes("P1")).length },
        { key: "p2", label: "P2", count: filtered.filter((record) => record.priority_tiers.includes("P2")).length },
        { key: "unassigned", label: "未标注", count: filtered.filter((record) => record.priority_tiers.length === 0).length },
      ];
      renderChart(byId("priorityChart"), priorityRows, "priority-");
    }

    function renderBullets(title, items) {
      if (!items || items.length === 0) return "";
      return `<section class="mini-section">
        <h3>${escapeHtml(title)}</h3>
        <ul>${items.map((item) => `<li>${escapeHtml(item)}</li>`).join("")}</ul>
      </section>`;
    }

    function hasSummary(record) {
      return Boolean(
        record.summary ||
        (record.key_points && record.key_points.length) ||
        (record.our_takeaways && record.our_takeaways.length) ||
        (record.cautions && record.cautions.length)
      );
    }

    function summaryId(record) {
      return `summary-${String(record.id).replace(/[^a-z0-9_-]/gi, "-")}`;
    }

    function renderSummaryBullets(title, items) {
      if (!items || items.length === 0) return "";
      return `<section class="summary-section">
        <h3>${escapeHtml(title)}</h3>
        <ul>${items.map((item) => `<li>${escapeHtml(item)}</li>`).join("")}</ul>
      </section>`;
    }

    function renderSummaryPanel(record) {
      if (!hasSummary(record)) return "";
      return `<section class="summary-panel" id="${escapeHtml(summaryId(record))}" hidden>
        ${record.summary ? `<p class="summary-copy">${escapeHtml(record.summary)}</p>` : ""}
        <div class="summary-grid">
          ${renderSummaryBullets("重点", record.key_points)}
          ${renderSummaryBullets("项目启发", record.our_takeaways)}
          ${renderSummaryBullets("注意 / 局限", record.cautions)}
        </div>
      </section>`;
    }

    function linkLabel(link) {
      const key = link.key || "";
      if (key.includes("github")) return "GitHub";
      if (key.includes("project")) return "Project";
      if (key.includes("arxiv_html")) return "arXiv HTML";
      if (key.includes("arxiv")) return "arXiv";
      if (key.includes("alpha")) return "alphaXiv";
      return link.label;
    }

    function renderLinks(record) {
      const links = record.links.map((link) => `
        <a class="link-button" href="${escapeHtml(link.url)}" target="_blank" rel="noopener noreferrer">
          ${iconMap.external}${escapeHtml(linkLabel(link))}
        </a>
      `);

      if (hasSummary(record)) {
        const panelId = summaryId(record);
        links.push(`
          <button class="link-button summary-toggle" type="button" data-summary-target="${escapeHtml(panelId)}" aria-expanded="false" aria-controls="${escapeHtml(panelId)}">
            ${iconMap.summary}Summary
          </button>
        `);
      }
      if (record.detail_href) {
        links.push(`
          <a class="link-button" href="${escapeHtml(record.detail_href)}">
            ${iconMap.details}Details
          </a>
        `);
      }
      return links.join("");
    }

    function renderRecord(record) {
      const priorityClass = (record.priority_tiers[0] || "unassigned").toLowerCase();
      const title = record.title || record.display_name;
      const nameChip = record.display_name && record.display_name !== title
        ? `<span class="chip chip-name">${escapeHtml(record.display_name)}</span>`
        : "";
      const reasons = record.summary_reasons || [];
      const reasonText = reasons.length
        ? reasons.map((reason) => `${reason.view}：${reason.text}`).join(" / ")
        : "";

      return `
        <article class="record-card" data-stage="${escapeHtml(record.stage_id)}">
          <div class="record-inner">
            <header class="record-head">
              <div>
                <h2 class="record-title">
                  ${escapeHtml(title)}
                </h2>
                <div class="chip-row">
                  <span class="chip chip-id">${escapeHtml(record.id)}</span>
                  ${nameChip}
                  <span class="chip chip-stage-${escapeHtml(record.stage_id)}">${escapeHtml(record.stage_label)}</span>
                  <span class="chip chip-${escapeHtml(priorityClass)}">${escapeHtml(priorityLabel(record))}</span>
                </div>
              </div>

            </header>
            <div class="meta-line">
              <span>${escapeHtml(record.year || "未知年份")}</span>
              <span>${escapeHtml(record.type || "未标注类型")}</span>
              ${record.arxiv_id ? `<span>arXiv ${escapeHtml(record.arxiv_id)}</span>` : ""}
            </div>
            ${reasonText ? `<div class="reason">${escapeHtml(reasonText)}</div>` : ""}
            <div class="body-grid">
              ${renderBullets("核心内容", record.core_content)}
              ${renderBullets("指标 / 设计", record.metric_ideas)}
              ${renderBullets("当前阶段建议", record.current_stage_advice)}
            </div>
            <footer class="link-row">${renderLinks(record)}</footer>
            ${renderSummaryPanel(record)}
          </div>
        </article>
      `;
    }

    function activeFilterText() {
      const bits = [];
      const view = payload.views.find((item) => item.id === state.view);
      if (view) bits.push(view.label);
      if (state.stage !== "all") bits.push(stageLabels.get(state.stage));
      if (state.priority !== "all") bits.push(state.priority === "unassigned" ? "未标注" : state.priority);

      if (state.query) bits.push(`搜索：${state.query}`);
      return bits.join(" · ");
    }

    function render() {
      const filtered = sortedRecords(records.filter(recordMatches));
      renderMetrics(filtered);
      renderCharts(filtered);
      byId("visibleCount").textContent = filtered.length;
      byId("totalCount").textContent = records.length;
      byId("activeFilterText").textContent = activeFilterText();
      byId("recordList").innerHTML = filtered.map(renderRecord).join("");
      byId("emptyState").classList.toggle("visible", filtered.length === 0);
    }

    function wireEvents() {
      byId("searchInput").addEventListener("input", (event) => {
        state.query = normalize(event.target.value.trim());
        render();
      });
      byId("stageFilter").addEventListener("change", (event) => {
        state.stage = event.target.value;
        render();
      });
      byId("priorityFilter").addEventListener("change", (event) => {
        state.priority = event.target.value;
        render();
      });

      byId("sortMode").addEventListener("change", (event) => {
        state.sort = event.target.value;
        render();
      });
      byId("viewTabs").addEventListener("click", (event) => {
        const button = event.target.closest("button[data-view]");
        if (!button) return;
        state.view = button.dataset.view;
        renderControls();
        render();
      });
      byId("recordList").addEventListener("click", (event) => {
        const button = event.target.closest("button[data-summary-target]");
        if (!button) return;
        const panel = byId(button.dataset.summaryTarget);
        if (!panel) return;
        const expanded = button.getAttribute("aria-expanded") === "true";
        button.setAttribute("aria-expanded", String(!expanded));
        panel.hidden = expanded;
      });
    }

    function init() {

      renderControls();
      wireEvents();
      render();
    }

    init();
  </script>
</body>
</html>
